# Prompt 04, T3: the settings index of the same file, end to end as the hub runs it for every unique blob: decode, parse, flatten,
# and tree-sitter reading the text a second time and being checked against the parser. The prompt gives no number for it. The plan
# proposed 40 ms (plans/04-fact-engine.md, A1); the measured p95 was 45.8 ms (decode, parse and flatten 7 ms; tree-sitter's own
# parse of the 146 KB file 14 to 21 ms; its tree turned into the parser's shape 3 to 5 ms; flatten 1 ms), so a human set 60 ms
# (`plans/04-fact-engine.blockers.md`). The docs/performance.md budget table has only the SQL half of the settings search
# (P7.settings_search, prompt 05).

[[budget]]
id = "P6.index_settings"
description = "Settings index of a 6,000-line YAML file (parse, flatten, tree-sitter locations)"
bench = "engine/index_settings_6000_lines"
statistic = "p95"
threshold = 60
unit = "ms"
scale = "target"
registered = true

