# Performance budget registry (contract). Prompt 01 (T8) implements `cargo xtask bench-check`.
# An entry with registered = false counts as unmet until its owning prompt registers a benchmark.
# Thresholds are p95 unless `statistic` says otherwise. Units: milliseconds unless `unit` says otherwise.

[[budget]]
id = "P1"
description = "Out-of-band change visible in UI"
bench = "agent/oob_change_visible"
statistic = "p95"
threshold = 15000
unit = "ms"
scale = "target"
registered = false

