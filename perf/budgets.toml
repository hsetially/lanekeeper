# Performance budget registry (contract). Prompt 01 (T8) implements `cargo xtask bench-check`; budgets come from
# docs/performance.md and are changed only through a contract-change PR.
#
# Fields
#   id          P# or P#.sub_budget. Unique.
#   description What is measured.
#   bench       Where the result comes from. A criterion benchmark is `<group>/<function>` (read from
#               target/criterion/<group>/<function>/new/sample.json). Anything else (load tests, bundle size,
#               Lighthouse, memory) is a JSON file in target/perf-results/ with the same `bench` name.
#   statistic   p50, p95, p99, mean, max or min, computed over the per-iteration samples.
#   threshold   The budget, in `unit`.
#   unit        ms for criterion results; any other unit must match the result file's `unit` exactly.
#   scale       small or target: the fixture scale the measurement is made at.
#   direction   "upper" (default): the value must be <= threshold. "lower": the value must be >= threshold
#               (frames per second, Lighthouse score, replay throughput).
#   registered  false until the owning prompt has a benchmark or load test that produces the result. Flipping it to
#               true is that prompt's contract-change.
#
# bench-check fails on a registered entry that is over budget or has no result. An entry with registered = false is
# listed as UNMET and only fails with --strict (used by the load-test gate in prompt 16 and by release).

[[budget]]
id = "P1"
description = "Out-of-band change visible in UI"
bench = "agent/oob_change_visible"
statistic = "p95"
threshold = 15000
unit = "ms"
scale = "target"
registered = true

