[package]
name = "hub-platform-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
# cargo-fuzz needs a nightly compiler (sanitizer flags). The date is pinned in the Justfile (`fuzz_nightly`).
# The main workspace stays on stable 1.88; this crate is outside it and has its own lockfile (S19). It is the hub platform's
# own fuzz crate (plan A17): the root `fuzz/` crate belongs to prompt 01 and holds only the domain targets.

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds with nightly and must not change the root lockfile.
[workspace]

# The target names are the corpus directory names and the names in the plan, so they stay snake_case.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
# Exact pins (S19). libfuzzer-sys 0.4.13 was published 2026-06-04; the others are the versions the workspace uses.
libfuzzer-sys = "=0.4.13"
hub-platform = { path = "..", version = "0.1.0" }
domain = { path = "../../domain", version = "0.1.0" }
proto = { path = "../../proto", version = "0.1.0" }
prost = "=0.14.4"
x509-parser = { version = "=0.18.1", default-features = false }

[[bin]]
name = "hub_agent_message"
path = "fuzz_targets/hub_agent_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hub_join_csr"
path = "fuzz_targets/hub_join_csr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hub_forward_request"
path = "fuzz_targets/hub_forward_request.rs"
test = false
doc = false
bench = false
