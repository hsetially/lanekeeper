[package]
name = "identity-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
# cargo-fuzz needs a nightly compiler (sanitizer flags). The date is pinned in the Justfile (`fuzz_nightly`).
# The main workspace stays on stable 1.88; this crate is outside it and has its own lockfile (S19). It is the identity
# crate's own fuzz crate, as the agent's is (decision A16): the root `fuzz/` crate holds only the domain targets.

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds with nightly and must not change the root lockfile.
[workspace]

# The target names are the corpus directory names and the names in the plan, so they stay snake_case.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
# Exact pins (S19). libfuzzer-sys 0.4.13 was published 2026-06-04; the others are the versions the workspace uses.
libfuzzer-sys = "=0.4.13"
hub-identity = { path = "..", version = "0.1.0" }
# The CSRF check takes request headers (T3). Already in the graph through hub-identity; same exact pin as the workspace.
http = "=1.5.0"
# The audit targets (T5) build events and check rows with the ports' own definitions. Path dependencies, already in the graph
# through hub-identity; serde_json has the workspace pin.
domain = { path = "../../domain", version = "0.1.0" }
ports = { path = "../../ports", version = "0.1.0" }
serde_json = "=1.0.151"

[[bin]]
name = "identity_jwt"
path = "fuzz_targets/identity_jwt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_cookie"
path = "fuzz_targets/identity_cookie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_audit_event"
path = "fuzz_targets/identity_audit_event.rs"
test = false
doc = false
bench = false
