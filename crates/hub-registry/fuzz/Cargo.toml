[package]
name = "registry-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
# cargo-fuzz needs a nightly compiler (sanitizer flags). The date is pinned in the Justfile (`fuzz_nightly`).
# The main workspace stays on stable 1.88; this crate is outside it and has its own lockfile (S19). It is the registry's own
# fuzz crate, as the agent's, the identity crate's, the platform's and the engine's are: the root `fuzz/` crate holds only the
# domain targets.

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds with nightly and must not change the root lockfile.
[workspace]

# The target names are the corpus directory names and the names in the plan, so they stay snake_case.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
# Exact pins (S19). libfuzzer-sys 0.4.13 was published 2026-06-04; the others are the versions the workspace uses.
libfuzzer-sys = "=0.4.13"
hub-registry = { path = "..", version = "0.1.0" }
# Path dependencies, already in the graph through hub-registry; `bytes` has the workspace pin.
domain = { path = "../../domain", version = "0.1.0" }
engine = { path = "../../engine", version = "0.1.0" }
ports = { path = "../../ports", version = "0.1.0" }
bytes = "=1.12.1"

[[bin]]
name = "registry_delta"
path = "fuzz_targets/registry_delta.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_cursor"
path = "fuzz_targets/registry_cursor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_query"
path = "fuzz_targets/registry_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_sentinel_path"
path = "fuzz_targets/registry_sentinel_path.rs"
test = false
doc = false
bench = false
