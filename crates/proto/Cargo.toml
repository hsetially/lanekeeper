[package]
name = "proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
domain.workspace = true
bytes.workspace = true
prost.workspace = true
thiserror.workspace = true
# `codegen` for the generated client and server, `zstd` for compressed streams (P4). Transport (channel, server)
# is the consumer's choice; the generated code does not need it.
tonic = { workspace = true, features = ["codegen", "zstd"] }
tonic-prost.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
tonic = { workspace = true, features = ["codegen", "zstd", "transport"] }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
tokio-stream.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
tower = { workspace = true, features = ["util"] }
proptest.workspace = true
static_assertions.workspace = true
