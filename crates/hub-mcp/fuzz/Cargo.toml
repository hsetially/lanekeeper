[package]
name = "hub-mcp-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
# cargo-fuzz needs a nightly compiler (sanitizer flags). The date is pinned in the Justfile (`fuzz_nightly`).
# The main workspace stays on stable 1.88; this crate is outside it and has its own lockfile (S19). It is the MCP crate's own fuzz
# crate, as the identity crate's is (decision A10 of plan 07): the root `fuzz/` crate holds only the domain targets.
#
# The targets include the two pure source files they test (`src/auth/header.rs` and `src/auth/token.rs`) with `#[path]` instead of
# depending on `hub-mcp`: the whole crate pulls in rmcp, axum, sqlx and the hub platform, and a sanitizer build of all of that costs
# gigabytes and minutes for two small parsers. Both files are written to need nothing of the crate (a test keeps them that way).

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds with nightly and must not change the root lockfile.
[workspace]

# The target names are the corpus directory names and the names in the plan, so they stay snake_case.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
# Exact pins (S19). libfuzzer-sys 0.4.13 was published 2026-06-04; the others are the versions the workspace uses.
libfuzzer-sys = "=0.4.13"
http = "=1.5.0"
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys", "alloc"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
subtle = { version = "=2.6.1", default-features = false }
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[[bin]]
name = "mcp_bearer_header"
path = "fuzz_targets/mcp_bearer_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_pat_token"
path = "fuzz_targets/mcp_pat_token.rs"
test = false
doc = false
bench = false
