[package]
name = "hub-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# `auth::store::MemoryTokenStore`: the in-memory personal-token store of this crate's tests and the hub's (the Postgres one is
# `PgTokenStore`). Never enabled in the binary's release build.
fakes = ["ports/fakes"]

[dependencies]
domain.workspace = true
# `postgres` gives `Tx::from_pg`, which the token transaction hands to `AuditLog::record` (D80).
ports = { workspace = true, features = ["postgres"] }
hub-platform.workspace = true
async-trait.workspace = true
# HMAC-SHA-256 for the stored token hash and the CSPRNG for new tokens (S7). The stack's one crypto provider, so no `hmac` or `rand` crate of ours.
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
# Bounded caches: the personal-token cache (5 seconds) and the owners of live sessions.
moka.workspace = true
# Server side of the Streamable HTTP transport and server-initiated elicitation. No `macros` (the handler is written by hand),
# no `auth`, no `client`, no `reqwest` (workspace comment).
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server", "elicitation"] }
serde.workspace = true
serde_json.workspace = true
# Personal tokens in Postgres (T1). Runtime-checked queries, as in hub-identity. No TLS feature: TLS comes from the pool options.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tower.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
# This crate's own tests use the in-memory token store and the ports fakes.
hub-mcp = { path = ".", version = "0.1.0", features = ["fakes"] }
hub-platform = { workspace = true, features = ["fakes"] }
ports = { workspace = true, features = ["fakes"] }
futures.workspace = true
hex.workspace = true
insta.workspace = true
proptest.workspace = true
sha2.workspace = true
# Real Postgres 16 in a container (or `LK_TEST_PG_ADMIN_URL`), migrated as lanekeeper_migrator and used as lanekeeper_app.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "migrate"] }
testcontainers.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "registry"] }
