[package]
name = "hub-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
# cargo-fuzz needs a nightly compiler (sanitizer flags). The date is pinned in the Justfile (`fuzz_nightly`).
# The main workspace stays on stable 1.88; this crate is outside it and has its own lockfile (S19). It is the hub binary's own
# fuzz crate (plan 18, T1): the platform's targets are in `crates/hub-platform/fuzz/`, the identity's in `crates/hub-identity/fuzz/`.

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds with nightly and must not change the root lockfile.
[workspace]

# The target names are the corpus directory names and the names in the plan, so they stay snake_case.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
# Exact pins (S19). libfuzzer-sys 0.4.13 was published 2026-06-04; the others are the versions the workspace uses.
libfuzzer-sys = "=0.4.13"
hub = { path = "..", version = "0.1.0" }
domain = { path = "../../domain", version = "0.1.0" }
ports = { path = "../../ports", version = "0.1.0" }
# The PEM invariant reads an accepted leaf a second time with the parser the hub itself uses, and then with nothing of the hub's.
x509-parser = { version = "=0.18.1", default-features = false }

[[bin]]
name = "hub_settings"
path = "fuzz_targets/hub_settings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hub_cli_args"
path = "fuzz_targets/hub_cli_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hub_pem"
path = "fuzz_targets/hub_pem.rs"
test = false
doc = false
bench = false
