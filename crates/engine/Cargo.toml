[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
domain.workspace = true
# File content is `Bytes` end to end: a result that did not change is the same buffer, not a copy (T1).
bytes.workspace = true
# The D79 deny globs (T1) and every later glob rule (T4). Matching is linear in the path.
globset.workspace = true
thiserror.workspace = true
# Content and tree hashes (T4): SHA-256, the identity of a blob everywhere else in the system. Already pinned in the workspace.
sha2.workspace = true
# The YAML and JSON event parsers (T2, D90). Both keep every position the engine reports, and neither builds a tree.
granit-parser.workspace = true
json-event-parser.workspace = true
# Setting paths to line ranges for YAML (T3, D54). The C parser only ever reads input that the Rust parser accepted.
tree-sitter.workspace = true
tree-sitter-yaml.workspace = true
# The line diff of two texts (T5): Patience, hunks with context. Deterministic, and it reads nothing but the two slices it is given.
similar.workspace = true
# The text search (T7, D54): ripgrep's matcher and searcher over in-memory slices, on the caller's rayon pool (never the global one).
grep-regex.workspace = true
grep-searcher.workspace = true
grep-matcher.workspace = true
rayon.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
criterion.workspace = true
# The small-scale synthetic fixtures (`xtask::fixtures::generate`): the tests and benchmarks parse real-shaped files, never toy data.
xtask.workspace = true
tempfile.workspace = true
# Random JSON documents for the "JSON flattens like YAML" property (T2).
serde_json.workspace = true

[[bench]]
name = "parse_flatten"
harness = false

[[bench]]
name = "index_settings"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "search_text"
harness = false

[[bench]]
name = "full_recompute"
harness = false

[[bench]]
name = "incremental"
harness = false
