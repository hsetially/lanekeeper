[package]
name = "engine-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
# cargo-fuzz needs a nightly compiler (sanitizer flags). The date is pinned in the Justfile (`fuzz_nightly`).
# The main workspace stays on stable 1.88; this crate is outside it and has its own lockfile (S19). It is the engine's
# own fuzz crate (plan 04, decision A2): the root `fuzz/` crate belongs to prompt 01 and holds only the domain targets.

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds with nightly and must not change the root lockfile.
[workspace]

# The target names are the corpus directory names and the names in the plan, so they stay snake_case.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
# Exact pins (S19). libfuzzer-sys 0.4.13 was published 2026-06-04; the others are the versions the workspace uses.
libfuzzer-sys = "=0.4.13"
engine = { path = "..", version = "0.1.0" }
domain = { path = "../../domain", version = "0.1.0" }
bytes = "=1.12.1"

[[bin]]
name = "engine_bytes"
path = "fuzz_targets/engine_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_yaml"
path = "fuzz_targets/engine_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_json"
path = "fuzz_targets/engine_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_properties"
path = "fuzz_targets/engine_properties.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_flatten"
path = "fuzz_targets/engine_flatten.rs"
test = false
doc = false
bench = false
