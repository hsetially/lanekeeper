[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
domain.workspace = true
proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
cap-std.workspace = true
fastrand.workspace = true
futures.workspace = true
globset.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
k8s-openapi.workspace = true
kube.workspace = true
pem.workspace = true
prost.workspace = true
rayon.workspace = true
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tokio-stream.workspace = true
# The generated gRPC client runs over the agent's own HTTP/2 connection (`transport::grpc`), not tonic's `Channel`, so
# that the TLS settings, the URI scheme and the keepalive are all set in one place that no feature flag elsewhere in the
# workspace can change.
tonic = { workspace = true, features = ["codegen"] }
tower.workspace = true
tracing.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
# The fake hub issues certificates from the agent's CSR, which needs rcgen's CSR parser.
rcgen = { workspace = true, features = ["x509-parser"] }
# The fake hub is a real tonic server behind a real TLS acceptor, and one test needs a TLS 1.2-only server.
rustls = { workspace = true, features = ["tls12"] }
tonic = { workspace = true, features = ["server"] }

# Benchmarks (T4, rule 14). Two criterion benchmarks for the walker, and two harnesses that write
# `target/perf-results/*.json` for the numbers criterion cannot take (a latency over a connection, bytes on a wire).
[[bench]]
name = "full_rehash"
harness = false

[[bench]]
name = "stat_walk"
harness = false

[[bench]]
name = "oob_change"
harness = false

[[bench]]
name = "idle_traffic"
harness = false
