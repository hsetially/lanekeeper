[package]
name = "hub-writes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Hooks for the fuzz targets (S22): the preview token for one fixed request, so the target can ask what the service accepts. Off in
# every build of the hub; the crate's own tests and its fuzz crate switch it on.
fuzz-hooks = []
# Test doubles of the GitHub client: a constructor for a plain-HTTP local server. Off in every build of the hub; the crate's own
# tests switch it on.
test-doubles = []

[dependencies]
domain.workspace = true
# The fact engine validates and scans content before it is written (rule 7, S13) and gives the diffs and line endings.
engine.workspace = true
ports = { workspace = true, features = ["postgres"] }
# The guarded router the write routes are registered through (S4), the authenticated user and the problem type (plan A15).
hub-platform.workspace = true
async-trait.workspace = true
# The preview token (D46): HMAC-SHA256 over the request it is bound to. The stack's one crypto provider, already in the graph.
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
# Retry and wait jitter (rule 5).
fastrand.workspace = true
# The event stream the pull-request state watcher follows (`EventBus::subscribe`). Already a dev-dependency of this crate and in
# the graph through `ports`; no new crate.
futures.workspace = true
http.workspace = true
# The reveal action's rate limit (T10): a bounded table of per-user windows, the stack's cache, already used by 03a, 03b and the hub.
moka.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The idempotency, proposal and lock stores. Runtime-checked queries, like the other hub crates (no `.sqlx` metadata needed to
# build). No TLS feature: TLS comes from the pool options.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "json"] }
thiserror.workspace = true
# The GitHub leg (T5, plan A9): octocrab over our own TLS 1.3-only connector. See the workspace manifest for the pins and why.
octocrab.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
# The data key and the plaintext token are zeroized (S8); `Secret` does it on drop, and the cipher buffer is wiped by hand.
zeroize.workspace = true

[dev-dependencies]
# This crate's own tests need the fuzz hooks its feature switches on (the corpus replay).
hub-writes = { path = ".", version = "0.1.0", features = ["fuzz-hooks", "test-doubles"] }
ports = { workspace = true, features = ["fakes", "postgres", "conformance"] }
# `FakeSessionAuth` and `RouteSpec::registered`, for the route tests (S4).
hub-platform = { workspace = true, features = ["fakes"] }
tower = { workspace = true, features = ["util"] }
# Reads the OpenAPI operations (tags) in the route-table test.
serde-saphyr.workspace = true
# Real Postgres 16 in a container (or `LK_TEST_PG_ADMIN_URL`), migrated as lanekeeper_migrator and used as lanekeeper_app.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "json", "migrate"] }
testcontainers.workspace = true
futures.workspace = true
# Captures `tracing` output so the log tests can search it (S10).
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
proptest.workspace = true
# The golden Adaptive Card per kind of notification (T7).
insta = { workspace = true, features = ["json"] }
criterion.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
# The local GitHub server of the client tests: a TLS 1.3 server, a TLS 1.2-only one (which the client must refuse, S6) and their
# certificate. Both are in the graph already.
tokio-rustls.workspace = true
rcgen.workspace = true

# P8 (T1): the whole `edit` call through a fake agent, over a real Postgres.
[[bench]]
name = "edit_applied"
harness = false

# P12 (T1): the steady-state queries of the write path at target-scale row counts.
[[bench]]
name = "write_queries"
harness = false
