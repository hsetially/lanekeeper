[package]
name = "hub-writes-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
# cargo-fuzz needs a nightly compiler (sanitizer flags). The date is pinned in the Justfile (`fuzz_nightly`).
# The main workspace stays on stable 1.88; this crate is outside it and has its own lockfile (S19). It is the write path's own
# fuzz crate, as the agent's, the identity crate's and the platform's are: the root `fuzz/` crate holds only the domain targets.

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: it builds with nightly and must not change the root lockfile.
[workspace]

# The target names are the corpus directory names and the names in the plan, so they stay snake_case.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
# Exact pins (S19). libfuzzer-sys 0.4.13 was published 2026-06-04; the others are the versions the workspace uses.
libfuzzer-sys = "=0.4.13"
# The feature gives the target the preview token for one fixed request (the service itself needs no database for it).
hub-writes = { path = "..", version = "0.1.0", features = ["fuzz-hooks"] }
# The invariants build requests and canonical bodies with the contract's own types. Path dependencies and exact pins already
# in the graph through hub-writes.
domain = { path = "../../domain", version = "0.1.0" }
bytes = "=1.12.1"
serde_json = "=1.0.151"

[[bin]]
name = "writes_request_json"
path = "fuzz_targets/writes_request_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "writes_upload_multipart"
path = "fuzz_targets/writes_upload_multipart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "writes_preview_id"
path = "fuzz_targets/writes_preview_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "writes_github_token"
path = "fuzz_targets/writes_github_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "writes_github_responses"
path = "fuzz_targets/writes_github_responses.rs"
test = false
doc = false
bench = false
