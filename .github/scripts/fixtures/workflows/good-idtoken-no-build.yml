name: good-idtoken-no-build
on:
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    # A job without the token may build: this is where the dependencies' code runs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - run: cargo install --locked cargo-cyclonedx --version 0.5.7
      - run: cargo build --release --locked
      - run: npm ci && npm run build
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      # Prose is not a command: neither this comment nor the strings below start a build.
      - name: Say what is not run here (cargo install, npm ci, make)
        run: |
          echo "cargo install and npm ci are never run in this job"
          printf '%s\n' "run make sure the tag matches Cargo.toml" > /dev/null
          grep -n 'cargo build' Justfile || true
      - run: just ops-tools-install cosign
      - run: cosign sign-blob --yes file.rpm
      # A shell, a docker run and a download that name a build tool only in a message, and a download that is saved and checked, are not
      # build steps either.
      - run: |
          echo "bash -c 'cargo build' and docker run rust cargo build are not run here"
          echo "curl https://example.com/x | sh is not run here"
          curl -fsSL -o /tmp/tool https://example.com/tool && sha256sum -c tool.sha256
          docker run --rm gcr.io/distroless/static:nonroot --version
          bash -c 'echo hello'
      # A tool called by its path is read like the tool, and a path that is only an argument, a message or a name that merely starts with
      # a build tool's is not a command.
      - run: |
          echo "/usr/bin/cargo build and ~/.cargo/bin/cargo install and wget -O f url && sh f are not run here"
          grep -n '/usr/bin/make' Justfile || true
          ls -l /usr/bin/cargo "$HOME/.cargo/bin/cargo" || true
          /usr/local/bin/cosign sign-blob --yes file.rpm
          ./scripts/make-release-notes.sh
          ./gradlew --version
          RUSTFLAGS="--remap-path-prefix=/src=. --remap-path-prefix=/usr/local/cargo=/cargo -C target-feature=+crt-static" ./scripts/report.sh
          docker run --rm -e CARGO_BIN=/usr/local/cargo/bin/cargo gcr.io/distroless/static:nonroot --version
          # A download that is saved and then checked is not run by what follows; a file with another name is not the download.
          curl -fsSL -o /tmp/tool https://example.com/tool && sha256sum -c tool.sha256 && install -m 0755 /tmp/tool /usr/local/bin/tool
          wget -O /tmp/tool https://example.com/tool && sha256sum -c tool.sha256 && sh /tmp/tool
          curl -fsSL -o get.sh https://example.com/get.sh && sh other.sh
