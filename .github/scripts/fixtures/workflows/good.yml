name: good
on:
  pull_request:
    paths:
      - "src/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
permissions: {}
concurrency:
  group: good-${{ github.ref }}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: echo lint
  publish:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - run: echo publish
  call:
    uses: example/repo/.github/workflows/w.yml@0000000000000000000000000000000000000000
