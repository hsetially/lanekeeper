name: bad-idtoken-quoted-run
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - run: 'cargo install --locked cargo-cyclonedx'
      - run: "npm ci" # a comment after the quoted value
      - uses: "docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75" # v6.9.0
