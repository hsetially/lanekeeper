# Checks of the workflows themselves (09/T2; S19, S20): actionlint, zizmor, the SHA-pin check and the workflow rules, all through
# `just ci-lint` so that a developer runs exactly what CI runs. The checks of the code are in rust.yml, web.yml, contracts.yml,
# bench.yml and images.yml; each has a path filter, so a change to one area starts only its own workflow. A required status check
# whose workflow a pull request does not start stays "expected": require the checks that always apply (this one) or make the
# branch rule path-aware.
name: ci
on:
  pull_request:
    paths:
      - ".github/**"
      - "deploy/**/*.sh"
      - "renovate.json"
      - "Justfile"
      # pins-test runs every .github/scripts/*.test.mjs, among them the install guide's. It reads these files, so a change to one must
      # run it (a file that the guide names and nobody here lists is caught on the next push to main).
      - "deploy/INSTALL-GKE.md"
      - "deploy/charts/hub/values.yaml"
      - "deploy/charts/hub/values.schema.json"
      - "deploy/charts/gcp/values.yaml"
      - "deploy/charts/gcp/templates/_helpers.tpl"
      - "deploy/tests/kind/pins.env"
      - "crates/hub/HARDENING.md"
      - "crates/hub/README.md"
      - "crates/agent/HARDENING.md"
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # zizmor's online audits ask the GitHub API whether a pinned SHA belongs to the action's repository (impostor commits),
      # whether its version comment matches the SHA, and whether the action has known vulnerabilities. A token that can read
      # public data is all they need.
      LK_ZIZMOR_ONLINE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0
      - run: just ops-tools-install actionlint zizmor shellcheck
      - run: just ci-lint
      - run: just pins-test
