# The container images: built reproducibly, scanned, and published signed (09/T2; S16, S19, S20).
#
# EVERY RUN (pull requests, main, tags):
#   policy     the Dockerfile and model-lock policies, the pinned BuildKit, and the publishing script against a local registry.
#   scan-test  the vulnerability scan must fail on a planted critical finding (log4j), so a scan that cannot fail is noticed.
#   image      per image (hub, agent): build it twice from the same commit with the pinned BuildKit and require one digest
#              (deploy/images/reproducible-check.sh), write its CycloneDX SBOM (the image and the Rust crates in the binary),
#              and scan both: any critical finding fails the job. These jobs hold no write permission and no token.
# MAIN AND v* TAGS ONLY:
#   publish    per image: push the archive that was scanned, byte for byte, to GHCR by digest; sign it keyless (cosign, GitHub's
#              OIDC token, the Sigstore log); attach the SBOM as a signed attestation; attach SLSA build provenance; sign it again
#              with the Cloud KMS key that Binary Authorization checks, when the repository variables for it are set (plan 09 A5);
#              then verify every one of those from the registry, in the same job. This is the only job with a write permission.
#
# WHAT THE SPLIT PROTECTS. The build runs the code of every dependency (cargo build scripts, npm packages). It runs in jobs with
# `contents: read` only: no packages: write, no id-token: write. The publish job runs no build step: it handles the files that the
# image job made, with pinned tools, so no dependency's code ever holds a token that can push or sign.
#
# DOCKER HUB. Docker Hub limits anonymous pulls per IP address and GitHub-hosted runners share addresses, so every job that pulls
# starts with the docker-hub-mirror action, and the BuildKit builder is created with the same mirror (deploy/images/builder.sh).
# Every image is named by digest, so the mirror cannot change what is pulled. No Docker Hub token is stored (S19, S20).
#
# BUILDKIT. The digest of an image holds for one BuildKit version, so builds use the builder that deploy/images/builder.sh creates
# from the image pinned in deploy/images/tools.env, never the one that ships with the runner's Docker.
#
# NOT YET RUN ON GITHUB. The sandbox that wrote this workflow cannot reach GitHub's runners, so the first run is its test; what
# could be run there (the scripts, against a local registry and a local BuildKit of the same version) was. The keyless signing and
# attestation steps need GitHub's OIDC and can only be proved here.
name: images
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "proto/**"
      - "api/**"
      - "db/**"
      - "docs/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "deploy/images/**"
      - "deploy/policy/**"
      - "Justfile"
      - ".github/workflows/images.yml"
      - ".github/actions/docker-hub-mirror/**"
  push:
    branches: [main]
    tags: ["v*"]
permissions: {}
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"

jobs:
  policy:
    name: policies and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-mirror
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0
      # No Rust cache here (zizmor, cache-poisoning): this workflow publishes images, so none of its jobs restores a cache that a
      # pull request could have written. The price is a build of the hardening tests from scratch.
      - run: just ops-tools-install cosign crane
      - run: just images-policy-test
      - run: just images-builder-test
      - run: just images-publish-test

  scan-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-mirror
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0
      - run: just images-scan-test

  image:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [hub, agent]
    env:
      IMAGE: ${{ matrix.image }}
      LK_BUILDER: lanekeeper-buildkit
      # GHCR links a package to the repository by this label, and the workflow's token can push only to a linked package.
      LK_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-mirror
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0
      - name: Install cargo-cyclonedx (the SBOM of the crates in the binary)
        run: |
          set -euo pipefail
          . deploy/images/tools.env
          cargo install --locked cargo-cyclonedx --version "$LK_CARGO_CYCLONEDX_VERSION"
      - name: Create the BuildKit builder pinned in tools.env
        run: |
          set -euo pipefail
          . deploy/images/tools.env
          LK_DOCKER_HUB_MIRROR="$LK_CI_DOCKER_HUB_MIRROR" deploy/images/builder.sh "$LK_BUILDER"
      - name: Build twice from this commit and require one digest
        run: deploy/images/reproducible-check.sh "$IMAGE"
      - name: Write the SBOM
        run: deploy/images/sbom.sh "$IMAGE" --out target/images/repro/a
      - name: Scan the image and its SBOM (a critical finding fails the job)
        run: deploy/images/scan.sh "$IMAGE" --out target/images/repro/a
      - name: Say which image this is
        run: |
          set -euo pipefail
          digest="$(cat "target/images/repro/a/$IMAGE.digest")"
          {
            echo "### $IMAGE"
            echo
            echo "Built twice with BuildKit $LK_BUILDER: the digest is \`$digest\`, reproduced."
            echo "The SBOM has $(jq '.components | length' "target/images/repro/a/$IMAGE.cdx.json") components, and the scan found no critical finding."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the scanned image for the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.image }}
          path: |
            target/images/repro/a/${{ matrix.image }}.oci.tar
            target/images/repro/a/${{ matrix.image }}.digest
            target/images/repro/a/${{ matrix.image }}.cdx.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish ${{ matrix.image }}
    needs: [policy, scan-test, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR with the workflow's own token
      id-token: write # keyless signing: GitHub's OIDC token, exchanged for a short-lived Sigstore certificate
      attestations: write # the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        image: [hub, agent]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0
      - run: just ops-tools-install cosign crane
      - name: Fetch the scanned image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-${{ matrix.image }}
          path: target/images
      - name: Name the repository
        id: repo
        run: |
          set -euo pipefail
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Push by digest, sign, attach the SBOM
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ steps.repo.outputs.repository }}
        run: |
          set -euo pipefail
          export PATH="$PWD/target/ops-tools/bin:$PATH"
          printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref="$(deploy/images/publish.sh push "$IMAGE" "$REPOSITORY" "sha-$GITHUB_SHA")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then crane tag "$ref" "$GITHUB_REF_NAME"; fi
          deploy/images/publish.sh sign "$ref"
          deploy/images/publish.sh attest-sbom "$ref" "target/images/$IMAGE.cdx.json"
      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.repo.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The second signature, with a Cloud KMS key, is the one Binary Authorization checks (plan 09 A5). The key, the Workload
      # Identity pool and the service account come with the gcp chart (T6); until the repository variables below are set, this is
      # skipped, and the summary and a warning say so.
      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ vars.LK_COSIGN_KMS_KEY != '' && vars.LK_GCP_WIF_PROVIDER != '' && vars.LK_GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LK_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.LK_GCP_SERVICE_ACCOUNT }}
      - name: Sign with the Cloud KMS key
        if: ${{ vars.LK_COSIGN_KMS_KEY != '' && vars.LK_GCP_WIF_PROVIDER != '' && vars.LK_GCP_SERVICE_ACCOUNT != '' }}
        env:
          REF: ${{ steps.push.outputs.ref }}
          KMS_KEY: ${{ vars.LK_COSIGN_KMS_KEY }}
        run: |
          set -euo pipefail
          export PATH="$PWD/target/ops-tools/bin:$PATH"
          deploy/images/publish.sh sign "$REF" --key "$KMS_KEY"
          echo "The Cloud KMS signature was made with \`$KMS_KEY\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Say that there is no KMS signature
        if: ${{ vars.LK_COSIGN_KMS_KEY == '' || vars.LK_GCP_WIF_PROVIDER == '' || vars.LK_GCP_SERVICE_ACCOUNT == '' }}
        run: |
          echo "::warning::No Cloud KMS signature: LK_COSIGN_KMS_KEY, LK_GCP_WIF_PROVIDER and LK_GCP_SERVICE_ACCOUNT are not all set, so Binary Authorization has nothing to check yet."
          echo "No Cloud KMS signature was made (the repository variables for it are not all set), so Binary Authorization has no attestation to check." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the signature, the SBOM and the provenance from the registry
        env:
          REF: ${{ steps.push.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$PWD/target/ops-tools/bin:$PATH"
          # The signer must be this repository's images workflow, run on main or on a v* tag, and nothing else.
          repo_re="$(printf '%s' "$GITHUB_REPOSITORY" | sed -e 's/[][\.*^$+?(){}|]/\\&/g')"
          identity="^https://github\\.com/${repo_re}/\\.github/workflows/images\\.yml@refs/(heads/main|tags/v.+)\$"
          deploy/images/publish.sh verify "$REF" --identity-regexp "$identity" --issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://$REF" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/images.yml"
      - name: Print the reference to put in the chart values
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "Published, signed and verified: \`$REF\`"
            echo
            echo "Put this reference, with its digest, in the Helm values (plan 09 A29); a tag is never deployed."
          } >> "$GITHUB_STEP_SUMMARY"
