# The web app under the production CSP (prompt 08, S12). The page is served by the hub's own header code (the Rust example
# `web_fixture`), with the mock API in front of it (web/e2e/harness), and a real Chromium drives it: every route, every overlay and
# the editor, light and dark, failing on any CSP or Trusted Types violation. Actions are pinned by commit SHA (S19).
# The visual tests (08/T4) compare the app with the design's own pages, rendered by the design's runtime in the same browser: that
# runtime needs React 18.3.1, which it asks unpkg for. The runner does not depend on unpkg: the same two UMD files come from the npm
# registry, checked against pinned integrity values here and against the SRI in the design's support.js by the test (W30). In CI a
# missing reference is a failed test, never a skipped one. The app's own baselines (the app against itself) are generated by the
# `visual-baselines` job below (run it by hand), reviewed as its artifact, and committed with the line that ignores them removed
# from web/.gitignore; until then those tests fail in CI, because a baseline that is missing is never created silently.
# Later tasks add jobs to this file: the P10 performance gates and the filtered `cargo xtask bench-check` (08/T2).
name: web-e2e
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "crates/hub/**"
      - "api/openapi.yaml"
      - "Justfile"
      - ".github/workflows/web-e2e.yml"
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: just web-install
      # Playwright's own Chromium, for the pinned @playwright/test (web/e2e/harness/browser.ts finds it).
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: just web-gen-check
      - name: React 18.3.1 for the visual references (W30)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/react18"
          mkdir -p "$dir/pack" "$dir/umd"
          cd "$dir/pack"
          npm pack --silent react@18.3.1 react-dom@18.3.1
          check() {
            got="sha512-$(openssl dgst -sha512 -binary "$1" | base64 -w0)"
            if [ "$got" != "$2" ]; then echo "$1: $got is not the pinned $2"; exit 1; fi
          }
          check react-18.3.1.tgz "sha512-wS+hAgJShR0KhEvPJArfuPVN1+Hz1t0Y6n5jLrGQbkb4urgPE/0Rve+1kMB1v/oWgHgm4WIcV+i7F2pTVj+2iQ=="
          check react-dom-18.3.1.tgz "sha512-5m4nQKp+rZRb09LNH59GM4BxTh9251/ylbKIbpe7TpGxfJ+9kv6BLkLBXIjjspbgbnIBNqlI23tRnTWT0snUIw=="
          tar -xzf react-18.3.1.tgz package/umd/react.production.min.js
          tar -xzf react-dom-18.3.1.tgz package/umd/react-dom.production.min.js
          cp package/umd/react.production.min.js package/umd/react-dom.production.min.js "$dir/umd/"
          echo "LK_REACT18_DIR=$dir/umd" >> "$GITHUB_ENV"
      # Builds the Rust fixture, the production dist (with the dist scan) and the perf-mode dist, then runs Playwright.
      - run: just web-e2e

  # By hand (Actions, web-e2e, Run workflow): the baselines of the app against itself, made on the runner that compares them. The
  # artifact is reviewed by a person and committed (remove the `e2e/visual/__baselines__/` line of web/.gitignore in that commit).
  visual-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: just web-install
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: React 18.3.1 for the visual references (W30)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/react18"
          mkdir -p "$dir/pack" "$dir/umd"
          cd "$dir/pack"
          npm pack --silent react@18.3.1 react-dom@18.3.1
          check() {
            got="sha512-$(openssl dgst -sha512 -binary "$1" | base64 -w0)"
            if [ "$got" != "$2" ]; then echo "$1: $got is not the pinned $2"; exit 1; fi
          }
          check react-18.3.1.tgz "sha512-wS+hAgJShR0KhEvPJArfuPVN1+Hz1t0Y6n5jLrGQbkb4urgPE/0Rve+1kMB1v/oWgHgm4WIcV+i7F2pTVj+2iQ=="
          check react-dom-18.3.1.tgz "sha512-5m4nQKp+rZRb09LNH59GM4BxTh9251/ylbKIbpe7TpGxfJ+9kv6BLkLBXIjjspbgbnIBNqlI23tRnTWT0snUIw=="
          tar -xzf react-18.3.1.tgz package/umd/react.production.min.js
          tar -xzf react-dom-18.3.1.tgz package/umd/react-dom.production.min.js
          cp package/umd/react.production.min.js package/umd/react-dom.production.min.js "$dir/umd/"
          echo "LK_REACT18_DIR=$dir/umd" >> "$GITHUB_ENV"
      - run: just web-fixture
      - run: pnpm build
        working-directory: web
      # LK_UPDATE_BASELINES makes Playwright create the baselines that are missing (web/e2e/visual/baseline-rule.mjs) and fail the tests that
      # needed one; the tests that compare with the design run as in the e2e job. Two passes: the first creates the baselines (it
      # fails, once, for the ones it made), the second must pass on its own output.
      - run: pnpm exec playwright test --project=chromium e2e/visual
        working-directory: web
        env:
          LK_UPDATE_BASELINES: "1"
        continue-on-error: true
      - run: pnpm exec playwright test --project=chromium e2e/visual
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: web/e2e/visual/__baselines__
          if-no-files-found: error
          retention-days: 14
