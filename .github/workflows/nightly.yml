# Every night (09/T2; S19, S22, rule 14): the fuzz targets for ten minutes each instead of thirty seconds, the whole benchmark suite
# at target scale, GitHub's webhook ranges against the file Cloud Armor is built from, the database image's vulnerability scan (09/T6),
# and the supply-chain scans again, because an advisory can be published against a dependency that did not change. A job that fails shows up as a failed run of the workflow on main; the people who watch main read it.
name: nightly
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"

jobs:
  fuzz:
    # Each recipe runs every target of its crate: the longest, engine-fuzz, has ten targets, so a recipe takes up to 100 minutes.
    name: fuzz ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - fuzz-smoke
          - agent-fuzz
          - identity-fuzz
          - platform-fuzz
          - engine-fuzz
          - registry-fuzz
          - mcp-fuzz
          - writes-fuzz
          - hub-fuzz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # hub-fuzz builds the whole hub (the largest dependency graph of the matrix) next to the nightly toolchain and cargo-fuzz, on the runner's
      # root disk. The same two steps as the test job of rust.yml (main's PR 25 added them after `cargo test --workspace` ran out of disk).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0,cargo-deny@0.19.9,cargo-audit@0.22.2
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - name: Install the fuzz toolchain and cargo-fuzz (the versions of the Justfile)
        run: |
          set -euo pipefail
          nightly="$(just --evaluate fuzz_nightly)"
          rustup toolchain install "$nightly" --profile minimal
          cargo "+$nightly" install --locked cargo-fuzz --version "$(just --evaluate cargo_fuzz_version)"
      - name: Fuzz for ten minutes per target
        env:
          RECIPE: ${{ matrix.recipe }}
        run: just fuzz_seconds=600 "$RECIPE"
      - name: Keep what a crash left behind
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.recipe }}
          path: |
            fuzz/artifacts
            crates/*/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Disk left
        if: always()
        run: df -h /

  bench:
    runs-on: ${{ vars.LK_BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: lanekeeper
          POSTGRES_PASSWORD: lanekeeper-ci-only
          POSTGRES_DB: lanekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lanekeeper -d lanekeeper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      LK_REQUIRE_DOCKER: "1"
      LK_TEST_PG_ADMIN_URL: postgres://lanekeeper:lanekeeper-ci-only@localhost:5432/lanekeeper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The same two steps as the bench job of bench.yml, for the same reason (see there).
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/docker-hub-mirror
        with:
          restart: "false"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - run: just agent-fixtures
      # The same targets as bench.yml (`--bench '*'`: the 44 bench targets, not the lib and bin test harnesses; see there), and every one runs.
      - run: cargo bench --workspace --bench '*' --no-fail-fast --locked
      - run: just bench-check-rust
      - name: Keep the criterion results for the trend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-nightly
          path: |
            target/criterion
            target/perf-results
          if-no-files-found: ignore
          retention-days: 30
      - name: Disk left
        if: always()
        run: df -h /

  hook-ranges:
    # GitHub's webhook ranges (Q28) in deploy/values/hub/github-hook-ranges.yaml equal the list GitHub publishes. A stale file
    # means Cloud Armor drops real deliveries, or still allows addresses that are no longer GitHub's. To fix a failure, run
    # `node deploy/tools/github-hook-ranges.mjs --write` and commit the file (plan 09 T3).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - run: node --test deploy/tools/github-hook-ranges.test.mjs
      - run: node deploy/tools/github-hook-ranges.mjs --check

  db-image:
    # The database image is CloudNativePG's (09/T5, plans/09-deployment-ci.blockers.md B10), not one that images.yml builds, so it has no SBOM
    # and no scan of ours; the sandbox that chose it could not read its layers (B9). Scan the digest that deploy/values/db deploys, with the grype
    # setup of the images we build: any critical finding fails the job, and so does a values file without a usable digest. Nightly, because an
    # advisory can be published against an image that did not change. To fix a failure, move the digest in deploy/values/db/*.yaml to a newer
    # image (at least 14 days old, rule 15), or have a human record an exception in deploy/images/grype.yaml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-hub-mirror
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0
      - run: just images-scan-db

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just@1.40.0,cargo-deny@0.19.9,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit
      - run: just ops-tools-install osv-scanner
      - run: just osv-scan
