<!-- @dsCard group="Colors" viewport="700x110" name="Status badges" subtitle="Drift + ops states: colour, icon and label, light and dark" -->
<link rel="stylesheet" href="../styles.css">
<body style="margin:0;font:12px/16px var(--font-sans)">
<div id="r"></div>
<script>
const s=[['sync','In sync','check'],['git','Git ahead','arrow-down-to-line'],['nfs','NFS ahead','arrow-up-from-line'],['conflict','Conflict','split'],['intentional','Intentional','pin'],['unknown','Unknown','circle-help'],['untracked','Untracked','circle-dashed'],['restart','Pending restart','clock'],['locked','Locked','lock'],['approval','Pending approval','hourglass']];
document.getElementById('r').innerHTML=['light','dark'].map(m=>`<div data-theme="${m}" style="display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--background)">${s.map(([k,l,i])=>`<span style="display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;font-weight:500;color:var(--status-${k}-fg);background:var(--status-${k}-bg);border:1px ${k==='untracked'?'dashed':'solid'} var(--status-${k}-border)"><span style="width:12px;height:12px;background:currentColor;mask:url(../assets/icons/${i}.svg) center/contain no-repeat"></span>${l}</span>`).join('')}</div>`).join('');
</script>
</body>
