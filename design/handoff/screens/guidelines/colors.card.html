<!-- @dsCard group="Colors" viewport="700x150" name="Semantic colours" subtitle="shadcn tokens, light (top) and dark (bottom)" -->
<link rel="stylesheet" href="../styles.css">
<body style="margin:0;font:12px/16px var(--font-sans)">
<div id="r"></div>
<script>
const t=['background','card','muted','accent','border','input','foreground','muted-foreground','primary','ring','destructive','selection'];
document.getElementById('r').innerHTML=['light','dark'].map(m=>`<div data-theme="${m}" style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:8px;background:var(--background);color:var(--foreground)">${t.map(n=>`<div><div style="height:28px;border-radius:4px;border:1px solid var(--border);background:var(--${n})"></div><div style="font-family:var(--font-mono);font-size:10px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n}</div></div>`).join('')}</div>`).join('');
</script>
</body>
