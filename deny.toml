# cargo-deny configuration (S19). Run: cargo deny check
[graph]
all-features = true
# The hub, the agent and the sentinel ship on Linux only (x86_64 and aarch64). Without `targets`, cargo-deny walks the
# dependency graph of every platform, so crates that are built only for wasm32, Windows, macOS or Android are checked too
# (for example `webpki-root-certs`, CDLA-Permissive-2.0, reached through `rustls-platform-verifier` on wasm32 alone). A
# decision recorded in plans/03b-hub-platform.blockers.md (A16): the Windows and macOS graphs are no longer checked.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# Four zstd advisories, ignored until 2026-11-30 and not longer. Decided by a human on 2026-10-26 (docs/decisions.md D135); the same
# list is in .cargo/audit.toml. The one user of `zstd` is `tonic` 0.14.6 (its `zstd` feature requires `zstd ^0.13`, and no `tonic`
# release moves to `zstd` 0.14, where the fixes are), and it calls only `zstd::stream::read::Encoder::new`, `Decoder::new` and
# `std::io::copy`. Remove an entry when `tonic` can take `zstd` >= 0.14.3 (`zstd-safe` >= 8.2.0, `zstd-sys` >= 2.1.2), and all of
# them on 2026-11-30 whether or not that happened: they are not a permanent exception. cargo-deny cannot expire an ignore by itself,
# so the date is kept by a person (D135).
ignore = [
  { id = "RUSTSEC-2026-0391", reason = "zstd: the `with_context` constructors reuse a context. tonic builds each stream with `Encoder::new` and `Decoder::new`, which own a fresh context." },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe: `Seekable::decompress` (the `seekable` API). tonic does not use it." },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe: `DCtx::decompress_stream` exposes uninitialized memory through `zstd::stream::write::Decoder`. The advisory says `stream::read::Decoder`, which tonic uses, is not affected." },
  { id = "RUSTSEC-2026-0410", reason = "zstd-sys: the allocator shim of wasm32. Everything shipped is Linux (`targets` above)." },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]
confidence-threshold = 0.9

# libfuzzer-sys bundles LLVM's libFuzzer, which is also under the permissive NCSA licence. It is a build-time tool of the
# fuzz crate (`fuzz/`, never shipped), so the exception names that one crate instead of allowing NCSA everywhere.
# Checked by `just fuzz-smoke` (it runs `cargo deny --manifest-path fuzz/Cargo.toml` first); the root workspace does not contain it.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# Workspace crates are `publish = false` with license "UNLICENSED"; skip the license check for them only.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "serde_yaml", reason = "Unmaintained; prompt 04 chooses a maintained YAML crate (AGENTS.md rule)" },
  { crate = "openssl", reason = "Use rustls with aws-lc-rs (S6)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
