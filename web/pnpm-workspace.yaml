# S19: refuse package versions published less than 14 days ago (value in minutes).
minimumReleaseAge: 20160
# Lifecycle scripts stay blocked (pnpm's default). esbuild works without its postinstall check.
ignoredBuiltDependencies:
  - esbuild
# Monaco's package.json pins dompurify 3.4.15, which has two low advisories (GHSA-p98j-92pf-mc4p, GHSA-6688-9rhm-gjv2).
# The 3.4.16 patch release is 23 days old on 2026-10-17. Monaco also ships its own vendored copy under
# esm/vs/base/browser/dompurify/, which this override cannot change; src/editor never reaches it (see docs/threat-model.md).
overrides:
  dompurify: 3.4.16
