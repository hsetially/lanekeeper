# S19: refuse package versions published less than 14 days ago (value in minutes).
minimumReleaseAge: 20160
# Lifecycle scripts stay blocked (pnpm's default). esbuild works without its postinstall check.
ignoredBuiltDependencies:
  - esbuild
# Monaco's package.json pins dompurify 3.4.15, which has advisories (GHSA-p98j-92pf-mc4p, GHSA-6688-9rhm-gjv2) that 3.4.16 did not
# close either: 3.4.17 does close GHSA-c6gr-qvv4-5v3f, GHSA-cg2g-xh64-v4q7 (9.2) and GHSA-mrv2-3pqr-j5jr. It was published on
# 2026-10-12 and is 14 days old on 2026-10-26. Monaco also ships its own vendored copy under
# esm/vs/base/browser/dompurify/, which this override cannot change; src/editor never reaches it (see docs/threat-model.md).
# undici reaches web/ twice, 7.29.1 (pinned exactly by @scalar/json-magic, under orval) and 7.30.0 (jsdom, under vitest). The undici findings
# that osv-scanner reports (B19, osv-scanner.toml) are fixed in 7.30.1, published on 2026-10-15 and 14 days old on 2026-10-29.
# zod 4 reaches web/ through orval (@orval/zod, @scalar/types) and eslint-plugin-react-hooks, all devDependencies. The zod finding of B19 is
# fixed in 4.6.6, published on 2026-10-11. zod 3.25.76 is pinned exactly by chromium-bidi (under lighthouse) and is left alone.
overrides:
  dompurify: 3.4.17
  undici: 7.30.1
  zod@^4: 4.6.6
