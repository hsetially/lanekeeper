# osv-scanner configuration (S19; plan 09 blockers, B17 and B19). `just osv-scan` passes this file with `--config osv-scanner.toml`, so one
# file judges every lockfile of the repository: the root Cargo.lock, the fuzz crates' lockfiles and both pnpm lockfiles. (Without --config,
# osv-scanner looks for an osv-scanner.toml beside each lockfile, and the fuzz crates would not see this one.) The format is osv-scanner v2's:
# `[[IgnoredVulns]]` takes id, ignoreUntil (an unquoted date) and reason; `[[PackageOverrides]]` takes name, version, ecosystem, ignore,
# reason and an optional effectiveUntil. The pinned 2.6.0 (Justfile: osv_scanner_version) accepts --config.
#
# Every entry was decided by a human, says so in its reason, and (but for the package override) ends on a date, after which osv-scanner
# reports the advisory again and the job fails. .github/scripts/osv-config.test.mjs checks the shape of each entry and the recipe.
#
# NOT ignored, on purpose: the npm findings (dompurify, undici, fast-uri, @vitest/mocker, zod). A human decided on 2026-10-26 to WAIT for
# their fixes to be 14 days old (rule 15) instead of ignoring them: undici 7.30.1 and @vitest/mocker 4.1.12 on 2026-10-29, fast-uri 3.1.9
# on 2026-11-02; the dompurify fix is a separate PR. The job stays red for them until then (plans/09-deployment-ci.blockers.md, B19).

# The zstd advisories (B17). One shared wording in each reason, and one date.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0391"
ignoreUntil = 2026-11-30
reason = "Decided by a human on 2026-10-26: a time-boxed ignore. The only user of zstd is tonic 0.14.6 (its `zstd` feature requires zstd ^0.13; no tonic release moves to zstd 0.14), which calls only `zstd::stream::read::{Encoder,Decoder}::new` and `std::io::copy`: not `with_context`, not the seekable API, not dictionaries, not `try_clone`, not `train_from_buffer`, not the write-side Decoder; RUSTSEC-2026-0410 is wasm32 only and the shipped targets are Linux. Revisit by 2026-11-30."

