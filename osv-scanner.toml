# rsa (B17). The same advisory and reasoning as .cargo/audit.toml.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-04-30
reason = "Approved by a human as an extra path of plan 01, and the same ignore as .cargo/audit.toml. RUSTSEC-2023-0071 (rsa, Marvin attack) has no fixed release. With sqlx's `macros` feature the lockfiles list `sqlx-mysql`, and `sqlx-mysql` depends on `rsa`: osv-scanner reads the lockfiles, not the compiled graph, and sees `rsa` in the root Cargo.lock and in the hub-identity, hub-registry and hub-writes fuzz lockfiles. Lanekeeper uses PostgreSQL only, so `rsa` is never compiled into any binary. Prove it with `cargo tree -i rsa -e all --target all`, which prints nothing. Remove this ignore if that command ever prints a path, or when sqlx drops the dependency. Revisit by 2027-04-30."

# Our own crate `domain` against the NLnet Labs crate of the same name (B17).
[[PackageOverrides]]
name = "domain"
version = "0.1.0"
ecosystem = "crates.io"
ignore = true
reason = "RUSTSEC-2026-0310 is about the `domain` DNS crate of NLnet Labs, published on crates.io. Ours is a path crate of this workspace (crates/domain, version 0.1.0, no `source` in Cargo.lock) that has the same name: a name collision, not the vulnerable crate. The override names version 0.1.0 only, so a registry crate called `domain` at any other version would still be reported."
