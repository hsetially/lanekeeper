# cargo-audit configuration (S19). Run: cargo audit
#
# One ignore, approved by a human as an extra path of plan 01.
#
# RUSTSEC-2023-0071 (rsa, Marvin attack, no fixed release): with sqlx's `macros` feature, Cargo.lock
# lists `sqlx-mysql`, and `sqlx-mysql` depends on `rsa`. Lanekeeper uses PostgreSQL only, so `rsa` is
# never compiled into any binary. Prove it with:
#   cargo tree -i rsa -e all --target all
# which prints nothing ("nothing to print", or "did not match any packages" while the lockfile has no `rsa`).
# Remove this ignore if that command ever prints a path, or when sqlx drops the dependency.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
