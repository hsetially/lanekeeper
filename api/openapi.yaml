          - type: 'null'
        role:
          $ref: '#/components/schemas/FileRole'
        hash:
          $ref: '#/components/schemas/ContentHash'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveSource'
          maxItems: 16
        settings:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveSetting'
          maxItems: 100000
        unresolved_placeholders:
          type: array
          items:
            $ref: '#/components/schemas/ShortText'
          maxItems: 10000
      additionalProperties: false
      required:
      - swimlane
      - file
      - tenant
      - channel
      - role
      - hash
      - sources
      - settings
      - unresolved_placeholders
    ServedFile:
      type: object
      properties:
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        application:
          $ref: '#/components/schemas/AppName'
        tenant:
          $ref: '#/components/schemas/TenantId'
        channel:
          oneOf:
          - $ref: '#/components/schemas/ChannelName'
          - type: 'null'
        file:
          $ref: '#/components/schemas/NfsPath'
        role:
          $ref: '#/components/schemas/FileRole'
        hash:
          $ref: '#/components/schemas/ContentHash'
        content_withheld:
