      additionalProperties: false
      required:
      - path
      - cells
    Grid:
      type: object
      properties:
        swimlanes:
          type: array
          items:
            $ref: '#/components/schemas/SwimlaneId'
          maxItems: 64
        rows:
          $ref: '#/components/schemas/GridRowPage'
      additionalProperties: false
      required:
      - swimlanes
      - rows
    SettingHit:
      type: object
      properties:
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        file:
          $ref: '#/components/schemas/NfsPath'
        path:
          $ref: '#/components/schemas/SettingPath'
        value:
          $ref: '#/components/schemas/SettingValue'
        location:
          $ref: '#/components/schemas/SettingLocation'
        logical_file:
          oneOf:
          - $ref: '#/components/schemas/LogicalFile'
          - type: 'null'
          description: The logical file of `file`, as on `FileEntry`. Absent when null.
        tenant:
          oneOf:
          - $ref: '#/components/schemas/TenantId'
          - type: 'null'
          description: The tenant of `file`, as on `FileEntry`. Null for a base file. Absent when null.
      additionalProperties: false
      required:
      - swimlane
      - file
      - path
      - value
      - location
    TextHit:
      type: object
      properties:
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        path:
          $ref: '#/components/schemas/NfsPath'
        line:
          type: integer
          minimum: 1
        text:
          type: string
        ranges:
          type: array
          items:
            type: array
            prefixItems:
            - type: integer
              minimum: 0
            - type: integer
              minimum: 0
            minItems: 2
            maxItems: 2
          maxItems: 1000
          description: The matches in `text`. Each pair is `[start, end)`, half-open, as 0-based UTF-8 byte offsets
            into the `text` of this hit (see `InlineRange`); a client that indexes a JavaScript string converts them
            first.
        logical_file:
          oneOf:
          - $ref: '#/components/schemas/LogicalFile'
          - type: 'null'
          description: The logical file of `path`, as on `FileEntry`. Absent when null.
        tenant:
          oneOf:
          - $ref: '#/components/schemas/TenantId'
          - type: 'null'
          description: The tenant of `path`, as on `FileEntry`. Null for a base file. Absent when null.
      additionalProperties: false
      required:
      - swimlane
      - path
      - line
      - text
      - ranges
    TextResults:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/TextHit'
          maxItems: 500
        truncated:
          type: boolean
      additionalProperties: false
      required:
      - hits
      - truncated
    Finding:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/FindingKind'
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        path:
          oneOf:
          - $ref: '#/components/schemas/NfsPath'
          - type: 'null'
        severity:
          $ref: '#/components/schemas/Severity'
        rule_ids:
          type: array
          items:
            $ref: '#/components/schemas/ShortText'
          maxItems: 100
        message:
          $ref: '#/components/schemas/ShortText'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/SettingLocation'
          maxItems: 1000
        detected_at:
          $ref: '#/components/schemas/Timestamp'
        logical_file:
          oneOf:
          - $ref: '#/components/schemas/LogicalFile'
          - type: 'null'
          description: The logical file of `path`, as on `FileEntry`. Null when the finding has no path. Absent when
            null.
        tenant:
          oneOf:
          - $ref: '#/components/schemas/TenantId'
          - type: 'null'
          description: The tenant of `path`, as on `FileEntry`. Null for a base file and when the finding has no path.
            Absent when null.
      additionalProperties: false
      required:
      - id
      - kind
      - swimlane
      - path
      - severity
      - rule_ids
      - message
      - locations
      - detected_at
    ExpectedAbsent:
      type: object
      properties:
        state:
          const: absent
      additionalProperties: false
      required:
      - state
    ExpectedHash:
      type: object
      properties:
        state:
          const: hash
        hash:
          $ref: '#/components/schemas/ContentHash'
      additionalProperties: false
      required:
      - state
      - hash
    Expected:
      oneOf:
      - $ref: '#/components/schemas/ExpectedAbsent'
      - $ref: '#/components/schemas/ExpectedHash'
      discriminator:
        propertyName: state
        mapping:
          absent: '#/components/schemas/ExpectedAbsent'
          hash: '#/components/schemas/ExpectedHash'
      description: 'What the caller expects to find. There is no blind write: a mismatch returns 409 and writes
        nothing.'
    ChangeEol:
      type: string
      enum:
      - lf
      - crlf
      description: Convert the file to this line ending style. Absent, an edit preserves an existing file's style (the
        dominant one, if its endings are mixed) and gives a new file the dominant style of its folder; a revert writes
        the stored version as it was. Only an explicit value ever changes a file's style.
    PreviewId:
      type: string
      pattern: ^[A-Za-z0-9._-]{1,128}$
      description: Issued by `POST /swimlanes/{id}/files/preview`. Opaque. Bound to the user, the swimlane, the path,
        the action and the hashes; it expires after 10 minutes.
    PrTargetTenant:
      type: object
      properties:
        kind:
          const: tenant
        branch:
          $ref: '#/components/schemas/TenantId'
      additionalProperties: false
      required:
      - kind
      - branch
    PrTargetBase:
      type: object
      properties:
        kind:
          const: base
      additionalProperties: false
      required:
      - kind
    PrTarget:
      oneOf:
      - $ref: '#/components/schemas/PrTargetTenant'
      - $ref: '#/components/schemas/PrTargetBase'
      discriminator:
        propertyName: kind
        mapping:
          tenant: '#/components/schemas/PrTargetTenant'
          base: '#/components/schemas/PrTargetBase'
      description: The branch the PR goes to, chosen by the person (D43). Absent, a tenant file goes to its own
        tenant's branch and a base file to the base branch.
    ValidationIssue:
      type: object
      properties:
        kind:
          type: string
          enum:
          - parse_error
          - duplicate_key
          - secret_match
        line:
          type: integer
          minimum: 1
          maximum: 4294967295
        rule:
          $ref: '#/components/schemas/ShortText'
          description: The secret rule's name for `secret_match`.
      additionalProperties: false
      required:
      - kind
      description: One thing the validation of content found. It never holds the text of the line, because the line
        may be the secret.
    PreviewScope:
      oneOf:
      - type: object
        properties:
          kind:
            const: every_service
        additionalProperties: false
        required:
        - kind
      - type: object
        properties:
          kind:
            const: application
          app:
            $ref: '#/components/schemas/AppName'
        additionalProperties: false
        required:
        - kind
        - app
      - type: object
        properties:
          kind:
            const: folder
          path:
            $ref: '#/components/schemas/NfsPath'
        additionalProperties: false
        required:
        - kind
        - path
      description: Who reads the file the change touches.
    PreviewWarning:
      oneOf:
      - type: object
        properties:
          kind:
            enum:
            - falls_back_to_base
            - no_file_left
            - forks_from_base
            - needs_notify_or_restart
            - new_folder_needs_config_server_restart
            - channels_yml_needs_config_server_restart
        additionalProperties: false
        required:
        - kind
      - type: object
        properties:
          kind:
            const: never_read
          suffix:
            $ref: '#/components/schemas/TenantId'
        additionalProperties: false
        required:
        - kind
        - suffix
      description: A consequence the person confirming the change should see (D46, D83, D85).
    PreviewedChange:
      type: object
      properties:
        change:
          $ref: '#/components/schemas/SettingChange'
          description: 'The change, with every flagged value replaced by its marker `[REDACTED: N chars, rule]`.'
        flagged:
          type: boolean
          description: True when the secret scan flagged the left or the right value of `change`; that side's `text`
            is the marker.
      additionalProperties: false
      required:
      - change
      - flagged
      description: One setting a preview says would differ. A flagged value is masked (S14b, D79).
    ChangePreview:
      type: object
      properties:
        preview_id:
          $ref: '#/components/schemas/PreviewId'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        scope:
          $ref: '#/components/schemas/PreviewScope'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PreviewWarning'
          maxItems: 20
        changes:
          type: array
          items:
            $ref: '#/components/schemas/PreviewedChange'
          maxItems: 50
          description: The settings that would differ in the effective config, sorted by path. A value the secret
            scan flags is masked here, never shown; `/files/reveal` is the one audited way to see it.
        changes_total:
          type: integer
          minimum: 0
          description: All of them, listed or not.
        effective_changed:
          type: boolean
          description: What the services get would differ.
      additionalProperties: false
      required:
      - preview_id
      - expires_at
      - scope
      - warnings
      - changes
      - changes_total
      - effective_changed
      description: What an upload or a delete would do, from the engine, and the token that lets that upload or delete
        through.
    EditFileRequest:
      type: object
      properties:
        path:
          $ref: '#/components/schemas/NfsPath'
        expected:
          $ref: '#/components/schemas/Expected'
        content:
          type: string
          maxLength: 2097152
          description: The whole new text. The limit is 2 MiB of UTF-8, counted in bytes by the server (a larger text
            is refused with 413 and nothing is written). `maxLength` counts characters, not bytes, and a character takes
            up to four bytes, so it is only a coarse bound of the schema and does not enforce that limit. The server
            restores the file's line endings, encoding and BOM.
        change_eol:
          $ref: '#/components/schemas/ChangeEol'
      additionalProperties: false
      required:
      - path
      - expected
      - content
    RevertFileRequest:
      type: object
      properties:
        path:
          $ref: '#/components/schemas/NfsPath'
        expected:
          $ref: '#/components/schemas/Expected'
        to:
          $ref: '#/components/schemas/ContentHash'
        change_eol:
          $ref: '#/components/schemas/ChangeEol'
      additionalProperties: false
      required:
      - path
      - expected
      - to
    RevealRequest:
      type: object
      properties:
        path:
          $ref: '#/components/schemas/NfsPath'
        setting:
          $ref: '#/components/schemas/SettingPath'
        reason:
          $ref: '#/components/schemas/ShortText'
          description: Why the person needs to see it. Recorded in the audit event. Without one the audit event says
            `masked_value_reveal`.
      additionalProperties: false
      required:
      - path
      - setting
    NotifyRequest:
      type: object
      properties:
        paths:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          minItems: 1
          maxItems: 100
          uniqueItems: true
      additionalProperties: false
      required:
      - paths
      description: Paths whose change the config-server should pick up (its `/update-resources`).
    NotifyResult:
      type: object
      properties:
        accepted:
          type: integer
          minimum: 0
        audit_id:
          type: integer
          format: int64
      additionalProperties: false
      required:
      - accepted
      - audit_id
    WriteApplied:
      type: object
      properties:
        outcome:
          const: applied
        hash:
          oneOf:
          - $ref: '#/components/schemas/ContentHash'
          - type: 'null'
        audit_id:
          type: integer
          format: int64
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          maxItems: 50
          description: Things worth knowing that did not stop the write, such as a duplicate key. Absent when there
            are none.
      additionalProperties: false
      required:
      - outcome
      - hash
      - audit_id
    WriteProposalCreated:
      type: object
      properties:
        outcome:
          const: proposal_created
        id:
          type: integer
          format: int64
      additionalProperties: false
      required:
      - outcome
      - id
    WriteResult:
      oneOf:
      - $ref: '#/components/schemas/WriteApplied'
      - $ref: '#/components/schemas/WriteProposalCreated'
      discriminator:
        propertyName: outcome
        mapping:
          applied: '#/components/schemas/WriteApplied'
          proposal_created: '#/components/schemas/WriteProposalCreated'
      description: A write either applies or becomes a proposal. Conflicts, locks and rejections are problem+json
        (409, 423, 422).
    CreatePrRequest:
      type: object
      properties:
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        title:
          $ref: '#/components/schemas/ShortText'
        body:
          oneOf:
          - type: string
            maxLength: 65536
          - type: 'null'
        target:
          $ref: '#/components/schemas/PrTarget'
      additionalProperties: false
      required:
      - swimlane
      - paths
      - title
    PrPreviewRequest:
      type: object
      properties:
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          minItems: 1
          maxItems: 100
          uniqueItems: true
        target:
          $ref: '#/components/schemas/PrTarget'
      additionalProperties: false
      required:
      - swimlane
      - paths
      description: The paths and the target of a `CreatePrRequest`, without the title and the body.
    PrPreviewFile:
      type: object
      properties:
        nfs_path:
          $ref: '#/components/schemas/NfsPath'
        repo_path:
          $ref: '#/components/schemas/RepoPath'
          description: Where the file lands in the repository, relative to its root.
        exists_on_branch:
          type: boolean
          description: Whether the file is already on the destination branch, so the PR changes it and does not add it.
      additionalProperties: false
      required:
      - nfs_path
      - repo_path
      - exists_on_branch
    PrPreview:
      type: object
      properties:
        repo:
          $ref: '#/components/schemas/ShortText'
          description: The full name of the repository that the PR goes to, `owner/name`, from configuration.
        destination:
          $ref: '#/components/schemas/PrTarget'
          description: The target after it was resolved, the same shape the request may carry. An absent target is
            replaced by the one the files imply.
        base_branch:
          $ref: '#/components/schemas/GitRef'
          description: The branch of `repo` that the PR is raised against.
        files:
          type: array
          items:
            $ref: '#/components/schemas/PrPreviewFile'
          maxItems: 100
          description: The files the PR would carry.
        unchanged:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          maxItems: 100
          description: Paths of the request that the PR would not carry, because the branch already has the same
            content.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ShortText'
          maxItems: 20
          description: What the person should know about where this PR goes, in the same words as `PrJob.warnings`.
        open_pr:
          oneOf:
          - $ref: '#/components/schemas/PrLink'
          - type: 'null'
          description: The pull request that is already open for these paths, which blocks a second one (D77), or null.
      additionalProperties: false
      required:
      - repo
      - destination
      - base_branch
      - files
      - unchanged
      - warnings
      - open_pr
    PrJob:
      type: object
      properties:
        id:
          type: integer
          format: int64
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        state:
          $ref: '#/components/schemas/PrJobState'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          maxItems: 100
        pr_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 512
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ShortText'
          maxItems: 20
          description: What the person should know about where this PR goes, such as a new tenant file that forks
            from base or a tenant file copied into base. Absent when there is nothing to say.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
      required:
      - id
      - swimlane
      - state
      - paths
      - pr_url
      - error
      - created_at
      - updated_at
    PrLink:
      type: object
