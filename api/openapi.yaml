      - swimlane
      - path
      - nfs_hash
      - state
      - pr_url
      - pr_number
      - author
      - created_at
      - closed_at
    Proposal:
      type: object
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/UserId'
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        path:
          $ref: '#/components/schemas/NfsPath'
          description: The first of `paths`.
        expected:
          $ref: '#/components/schemas/Expected'
        new_hash:
          $ref: '#/components/schemas/ContentHash'
          description: The hash of the proposed content. An all-zero hash means that the action writes no content, for
            example a delete or a restart.
        status:
          $ref: '#/components/schemas/ProposalStatus'
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/DiffHunk'
          maxItems: 100000
        setting_changes:
          type: array
          items:
            $ref: '#/components/schemas/SettingChange'
          maxItems: 100000
        severity:
          oneOf:
          - $ref: '#/components/schemas/Severity'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        decided_by:
          oneOf:
          - $ref: '#/components/schemas/UserId'
          - type: 'null'
        decision_comment:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
        action:
          $ref: '#/components/schemas/ProposalAction'
          description: What the proposal is for.
        via:
          $ref: '#/components/schemas/ProposalVia'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          maxItems: 100
          description: Every path of the proposal, of which `path` is the first. For a `restart` it is the one
            `namespace/name` of the service.
        decided_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When the proposal was approved or rejected, null while it is not decided.
      additionalProperties: false
      required:
      - id
      - author
      - swimlane
      - path
      - expected
      - new_hash
      - status
      - hunks
      - setting_changes
      - severity
      - created_at
      - expires_at
      - decided_by
      - decision_comment
    ApproveRequest:
      type: object
      properties:
        comment:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
      additionalProperties: false
    RejectRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/ShortText'
      additionalProperties: false
      required:
      - reason
    Draft:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DraftId'
        author:
          $ref: '#/components/schemas/UserId'
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        path:
          $ref: '#/components/schemas/NfsPath'
        expected:
          $ref: '#/components/schemas/Expected'
        new_hash:
          $ref: '#/components/schemas/ContentHash'
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/DiffHunk'
          maxItems: 100000
        setting_changes:
          type: array
          items:
            $ref: '#/components/schemas/SettingChange'
          maxItems: 100000
        status:
          $ref: '#/components/schemas/ProposalStatus'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        severity:
          oneOf:
          - $ref: '#/components/schemas/Severity'
          - type: 'null'
          description: The severity of the change, from the severity rules (D76). Absent when the server has no answer.
            Absent in older servers.
        effects:
          type: array
          items:
            type: array
            prefixItems:
            - $ref: '#/components/schemas/ServiceRef'
            - $ref: '#/components/schemas/PickupState'
            minItems: 2
            maxItems: 2
          maxItems: 1000
          description: When the change would take effect for each consuming service (D85), as pairs of a service and its
            pickup state. Absent when there are none, and in older servers.
      additionalProperties: false
      required:
      - id
      - author
      - swimlane
      - path
      - expected
      - new_hash
      - hunks
      - setting_changes
      - status
      - expires_at
    DraftRequest:
      type: object
      properties:
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        path:
          $ref: '#/components/schemas/NfsPath'
        expected:
          $ref: '#/components/schemas/Expected'
        content:
          type: string
          maxLength: 2097152
          description: The whole new text. The limit is 2 MiB of UTF-8, counted in bytes by the server (a larger text
            is refused with 413 and nothing is saved). `maxLength` counts characters, not bytes, and a character takes
            up to four bytes, so it is only a coarse bound of the schema and does not enforce that limit.
      additionalProperties: false
      required:
      - swimlane
      - path
      - expected
      - content
    Me:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          swimlane_access:
            type: string
            enum:
            - all
            description: Every signed-in user sees every swimlane.
          needs_github_token:
            type: boolean
            description: True while the user has no stored GitHub token, so the web app can prompt for one before
              the first edit. Absent in older servers; treat absence as false.
        additionalProperties: false
    GithubTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          format: password
          description: A GitHub personal access token. Stored envelope-encrypted; never returned, logged or audited
            (S7, S21).
      additionalProperties: false
      required:
      - token
    GithubCredential:
      type: object
      properties:
        github_login:
          $ref: '#/components/schemas/ShortText'
