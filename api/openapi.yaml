        last_used_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        token:
          type: string
          readOnly: true
          description: The bearer token for the MCP server, sent as `Authorization` `Bearer` plus this value. Shown once,
