# REST contract for the web UI. Prompt 01 (T5) writes every operation. Generated clients (orval) come from this file.
# Paths are full paths (`/api/v1/...`) because the S4 route-guard harness compares them with the hub's routes as written.
# Every operation carries x-required-role (S4); `none` is reserved for /auth/login, /auth/callback, /auth/logout and /hooks/github.
# Changing this file is a contract change: see the lanekeeper-contract-change skill.
openapi: 3.1.0
info:
  title: Lanekeeper API
  version: 0.1.0
  summary: REST contract for the web UI.
  description: 'Prompt 01 (T5) writes every operation. Conventions: every path is the full path (`/api/v1/...`);
    cookie session plus a double-submit `X-CSRF-Token` on every non-GET; `Idempotency-Key` on every write; errors
    are `application/problem+json`; lists use keyset pagination (`cursor`, `limit` at most 500); content responses
    carry an `ETag` and honour `If-None-Match`; every operation declares `x-required-role` (`viewer`, `editor`,
    `operator`, `admin`, or `none` for the four open operations) (S4).'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /
security:
- sessionCookie: []
tags:
- name: auth
  description: Sign-in and sessions (outside /api/v1)
- name: me
  description: The signed-in user
- name: swimlanes
  description: Swimlanes and their files
- name: compare
  description: Comparisons and the grid
- name: search
  description: Setting and text search
- name: findings
  description: Consistency checks
- name: writes
  description: Edits, uploads, restarts, PRs, proposals and drafts
- name: content-store
  description: Content by hash
- name: events
  description: Server-sent events
- name: hooks
  description: Inbound webhooks
- name: docs
  description: Docs, search and feature flags
- name: admin
  description: Administration (Admin only)
- name: content
  description: Operations whose responses carry an ETag and honour If-None-Match
paths:
  /api/v1/admin/access-requests:
    get:
      operationId: adminListAccessRequests
      summary: List access requests
      tags:
      - admin
      x-required-role: admin
      parameters:
