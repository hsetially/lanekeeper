          $ref: '#/components/schemas/Timestamp'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ShortText'
          maxItems: 64
        expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When the token expires, null when GitHub did not say.
        expires_soon:
          type: boolean
          description: True when the token expires within 7 days, and after it has expired, so the page can ask for a
            new one before a pull request fails.
      additionalProperties: false
      required:
      - github_login
      - verified_at
      - scopes
