  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Live events (SSE)
      description: |-
        Server-sent events (`text/event-stream`). Each frame is one `DomainEvent` (see that schema): the `event:` line is its `type`, the `data:` line is the event as JSON on a single line, and an `id:` line carries the event id, a positive integer, only on stored events. An event that is not stored, such as a `resync` that the server makes up because it cannot replay, has no `id:` line.

        Frames. The first frame is `retry: 3000`, the reconnect delay in milliseconds. A `: heartbeat` comment is sent every 15 seconds; at each heartbeat the server checks that the user may still listen and closes the stream if not. A stream lives at most 30 minutes; the server then closes it with a final `retry: 3000`, and the client reconnects with its `Last-Event-ID` and loses nothing.

        Resume. A connection without `Last-Event-ID` gets no replay and no `resync`: it starts at the live edge, and the page loads what it shows with its ordinary reads. A browser's `EventSource` sends the header itself when it reconnects. With the id of the last event received, the server replays the stored events after it (at most 1,000 events, filtered like the live stream) and then carries on live. If the id is too old, is not a positive integer, or the stored events cannot be read, the server sends one `resync` instead, and the client refetches what it shows.

        Limits. At most 5 streams per user: the next request gets 429, and so does any request to a replica that is full. An event is stored as an envelope of at most 4,096 bytes; an event that would not fit is stored as a `resync` instead. Events carry ids and hashes only, never file content (S12).

        Filters. A `resync` passes both filters, so a filtered client still learns that it lagged. Otherwise `kinds` keeps only the kinds named, and `swimlane` keeps the events of those swimlanes and every event that belongs to no swimlane.
      tags:
      - events
      x-required-role: viewer
      parameters:
      - name: swimlane
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SwimlaneId'
          maxItems: 64
          uniqueItems: true
        description: Only events of these swimlanes; limited to what the user can see.
        style: form
        explode: true
      - name: kinds
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/EventKind'
          maxItems: 16
          uniqueItems: true
        description: Only these kinds; all when absent.
        style: form
        explode: true
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 64
        description: 'Resume after this event: the `id:` of the last event received, a positive integer. A `resync`
          event is sent if it is too old or is not one. Without the header nothing is replayed (see the description of
          the operation).'
      responses:
        '200':
          description: A `text/event-stream`. The `data:` of each frame is a `DomainEvent`; the description of the
            operation has the framing, the resume rules and the limits. Events carry ids and kinds only, never file
            content (S12).
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/DomainEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
