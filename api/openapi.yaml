      - text
      - ty
      - flag
    SettingChange:
      type: object
      properties:
        path:
          $ref: '#/components/schemas/SettingPath'
        kind:
          $ref: '#/components/schemas/ChangeKind'
        left:
          oneOf:
          - $ref: '#/components/schemas/SettingValue'
          - type: 'null'
        right:
          oneOf:
          - $ref: '#/components/schemas/SettingValue'
          - type: 'null'
        left_location:
          oneOf:
          - $ref: '#/components/schemas/SettingLocation'
          - type: 'null'
        right_location:
          oneOf:
          - $ref: '#/components/schemas/SettingLocation'
          - type: 'null'
        severity:
          oneOf:
          - $ref: '#/components/schemas/Severity'
          - type: 'null'
      additionalProperties: false
      required:
      - path
      - kind
      - left
      - right
      - left_location
      - right_location
      - severity
    InlineRange:
      type: object
      description: A changed span inside a line. `start` and `end` are 0-based UTF-8 byte offsets into the `text` of the
        object that carries the range (`DiffLine.text` for `DiffLine.inline_changes`), half-open `[start, end)`, always
        on character boundaries, with `end` at most the byte length of `text`. They are not characters and not UTF-16
        units, so a client that indexes a JavaScript string converts them first, for example by slicing the bytes of
        a `TextEncoder` result. A secret match's location (`column` and `length`) is different, and counts characters.
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - start
      - end
    DiffLine:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DiffLineKind'
        text:
          type: string
        inline_changes:
          type: array
          items:
            $ref: '#/components/schemas/InlineRange'
          maxItems: 10000
          description: The changed spans of the line, as 0-based UTF-8 byte offsets into `text` (see `InlineRange`).
      additionalProperties: false
      required:
      - kind
      - text
      - inline_changes
    DiffHunk:
      type: object
      properties:
        old_start:
          type: integer
          minimum: 0
        old_lines:
          type: integer
          minimum: 0
        new_start:
          type: integer
          minimum: 0
        new_lines:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiffLine'
          maxItems: 100000
      additionalProperties: false
      required:
      - old_start
      - old_lines
      - new_start
      - new_lines
      - lines
    BinaryCompare:
      type: object
      properties:
        left:
          oneOf:
          - $ref: '#/components/schemas/ContentHash'
          - type: 'null'
        right:
          oneOf:
          - $ref: '#/components/schemas/ContentHash'
          - type: 'null'
        left_size:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        right_size:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
      additionalProperties: false
      required:
      - left
      - right
      - left_size
      - right_size
    Comparison:
      type: object
      properties:
        left:
          $ref: '#/components/schemas/CompareRef'
        right:
          $ref: '#/components/schemas/CompareRef'
        file:
          oneOf:
          - $ref: '#/components/schemas/LogicalFile'
          - type: 'null'
        class:
          $ref: '#/components/schemas/FileClass'
        identical:
          type: boolean
        eol_only:
          type: boolean
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/DiffHunk'
          maxItems: 100000
        setting_changes:
          type: array
          items:
            $ref: '#/components/schemas/SettingChange'
          maxItems: 100000
        binary:
          oneOf:
          - $ref: '#/components/schemas/BinaryCompare'
          - type: 'null'
      additionalProperties: false
      required:
      - left
      - right
      - file
      - class
      - identical
      - eol_only
      - hunks
      - setting_changes
      - binary
    TreeCompareEntry:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/LogicalFile'
        state:
          $ref: '#/components/schemas/CompareState'
      additionalProperties: false
      required:
      - file
      - state
    TreeComparison:
      type: object
      properties:
        entries:
          $ref: '#/components/schemas/TreeCompareEntryPage'
        skipped_identical_subtrees:
          type: integer
