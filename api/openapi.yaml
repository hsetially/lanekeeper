      - left_only
      - right_only
    RejectReason:
      type: string
      enum:
      - denied
      - too_large
      - invalid_content
      - unknown_swimlane
      - agent_unavailable
      - not_allowed
      - secret_detected
      - parse_error
    NotificationKind:
      type: string
      enum:
      - access_requested
      - proposal_pending
      - proposal_decided
      - service_restarted
      - pr_raised
      - agent_disconnected
      - critical_finding
      - drift_detected
      - sync_window_stale
    AccessRequestStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
    Problem:
      type: object
      description: RFC 9457 problem details. Never contains SQL, paths of the server, stack traces or secrets.
      properties:
        type:
          type: string
          format: uri-reference
          description: |-
            `urn:lanekeeper:problem:<code>`. What follows the last colon is the stable code of the problem and the discriminator: match on it, and fall back to `status` for a value you do not know, because the list can grow. Nothing is renamed, so both spellings below appear.

            Sent by the hub's own layers, with snake_case codes: `bad_request`, `unauthorized`, `forbidden`, `not_found`, `method_not_allowed`, `request_timeout`, `conflict`, `payload_too_large`, `unsupported_media_type`, `unprocessable`, `too_many_requests`, `internal`, `unavailable`, `shutting_down`, `gateway_timeout`, `idempotency_conflict` and `locked`. The GitHub token adds `classic_token`, `not_fine_grained_token`, `token_rejected`, `token_missing_access`, `github_account_mismatch`, `token_expired` and `token_unreadable`.

            Sent by the identity layer, with kebab-case codes: `unauthenticated`, `access-pending`, `access-disabled`, `insufficient-role`, `csrf`, `not-found`, `bad-request`, `unsupported-media-type`, `payload-too-large`, `conflict`, `too-many-requests`, `unprocessable`, `unavailable`, `sign-in-invalid`, `sign-in-refused`, `identity-provider` and `internal`.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          description: Quote this to find the request in the logs.
        code:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          maxLength: 64
          description: The suffix of `type`, repeated. Sent by the write and platform layers and absent from the problems
            of the identity layer, so read `type` first.
        reason:
          $ref: '#/components/schemas/RejectReason'
          description: Why a write was refused (422), when it was.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          maxItems: 50
          description: With `reason`, where in the content the problem is. Lines and rule names, never the text of a
            line.
      required:
      - type
      - title
      - status
      additionalProperties: true
    ConflictProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          current:
            oneOf:
            - $ref: '#/components/schemas/ContentHash'
            - type: 'null'
        required:
        - current
        description: '`current` is the hash found instead of the expected one; null when the file is absent.'
    LockedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          until:
            oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        required:
        - until
        description: A sync window or PR job holds the file.
    DuplicatePrProblem:
      type: object
      description: The 409 of `createPr` for a second pull request on a change that already has an open one (D77).
        `link` is the open one. Not an `allOf` of `Problem`, because `Problem.reason` is a `RejectReason` and
        `duplicate_pr` is not a write rejection.
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 256
        title:
          type: string
          maxLength: 256
        status:
          const: 409
        detail:
          type: string
          maxLength: 2048
        instance:
          type: string
          maxLength: 512
        request_id:
          type: string
          maxLength: 128
        code:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          maxLength: 64
        reason:
          const: duplicate_pr
        link:
          $ref: '#/components/schemas/PrLink'
      additionalProperties: false
      required:
      - type
      - title
      - status
      - reason
      - link
    TokenMissingAccessProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          base:
            type: boolean
            description: Whether the token can push to the base repository.
          tenant:
            type: boolean
            description: Whether the token can push to the tenant repository.
        required:
        - base
        - tenant
        description: The `token_missing_access` refusal of `putGithubToken` (422). The token has to push to both
          repositories, and these two flags say which one fell short.
    Evidence:
      type: object
      properties:
        executable:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
        login_identity:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
        observed_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      additionalProperties: false
    ActorUser:
      type: object
      properties:
        kind:
          const: user
        user:
          $ref: '#/components/schemas/UserId'
      additionalProperties: false
      required:
      - kind
      - user
    ActorOsLogin:
      type: object
      properties:
        kind:
          const: os_login
        login:
          $ref: '#/components/schemas/ShortText'
      additionalProperties: false
      required:
      - kind
      - login
    ActorJob:
      type: object
      properties:
        kind:
          const: job
        job:
          type: object
          properties:
            name:
              type: string
            uid:
              type: string
          additionalProperties: false
          required:
          - name
          - uid
      additionalProperties: false
      required:
      - kind
      - job
    Actor:
      oneOf:
      - $ref: '#/components/schemas/ActorUser'
      - $ref: '#/components/schemas/ActorOsLogin'
      - $ref: '#/components/schemas/ActorJob'
      discriminator:
        propertyName: kind
        mapping:
          user: '#/components/schemas/ActorUser'
          os_login: '#/components/schemas/ActorOsLogin'
          job: '#/components/schemas/ActorJob'
    Attribution:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/AttributionSource'
        confidence:
          $ref: '#/components/schemas/Confidence'
        actor:
          oneOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
        evidence:
          $ref: '#/components/schemas/Evidence'
      additionalProperties: false
      required:
      - source
      - confidence
      - actor
      - evidence
      description: Who changed a file and how sure we are (D73). Upgraded later, never downgraded.
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          $ref: '#/components/schemas/ShortText'
        display_name:
          $ref: '#/components/schemas/ShortText'
        role:
          oneOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
        status:
          $ref: '#/components/schemas/UserStatus'
        requires_approval:
          type: boolean
        github_login:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
        last_seen_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - email
      - display_name
      - role
      - status
      - requires_approval
      - github_login
      - last_seen_at
    FileFormat:
      type: object
      properties:
        eol:
          $ref: '#/components/schemas/EolStyle'
        encoding:
          $ref: '#/components/schemas/TextEncoding'
        bom:
          type: boolean
      additionalProperties: false
      required:
      - eol
      - encoding
      - bom
    FileEntry:
      type: object
      properties:
        path:
          $ref: '#/components/schemas/NfsPath'
        is_dir:
          type: boolean
        kind:
          $ref: '#/components/schemas/FileKind'
        class:
          $ref: '#/components/schemas/FileClass'
        role:
          $ref: '#/components/schemas/FileRole'
        size:
          type: integer
          minimum: 0
        hash:
          oneOf:
          - $ref: '#/components/schemas/ContentHash'
          - type: 'null'
        drift:
          $ref: '#/components/schemas/DriftState'
        format:
          oneOf:
          - $ref: '#/components/schemas/FileFormat'
          - type: 'null'
        content_withheld:
          type: boolean
          description: 'True for denied files: no content is stored or served.'
        attribution:
          oneOf:
          - $ref: '#/components/schemas/Attribution'
          - type: 'null'
        severity:
          oneOf:
          - $ref: '#/components/schemas/Severity'
          - type: 'null'
        pickup_state:
          oneOf:
          - $ref: '#/components/schemas/PickupState'
          - type: 'null'
        logical_file:
          oneOf:
          - $ref: '#/components/schemas/LogicalFile'
          - type: 'null'
          description: The file without the tenant suffix of its name, so that a tenant file and the base file it
            replaces have the same value. The same as `path` for a base file, `path` with `-<tenant>` taken out for a
            tenant file, null for a directory. The registry computes it with the reverse mapping of the path mapping
            rule and the tenants of the swimlane; the client never derives it. The way back from a logical file to the
            path in a swimlane is `EffectiveConfig.sources[].path` (`getEffectiveConfig`). Absent when null.
        tenant:
          oneOf:
          - $ref: '#/components/schemas/TenantId'
          - type: 'null'
          description: The tenant whose file this is, when its name ends in `-<tenant>` for a tenant of the swimlane.
            Null for a base file and for a directory. Absent when null.
      additionalProperties: false
      required:
      - path
      - is_dir
      - kind
      - class
      - role
      - size
      - hash
      - drift
      - format
      - content_withheld
      - attribution
      - severity
      - pickup_state
    VersionLabel:
      type: object
      properties:
        tag:
          oneOf:
          - $ref: '#/components/schemas/GitRef'
          - type: 'null'
        distance:
          type: integer
          minimum: 0
        commit:
          $ref: '#/components/schemas/CommitId'
      additionalProperties: false
      required:
      - tag
      - distance
      - commit
    SwimlaneSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SwimlaneId'
        display_name:
          $ref: '#/components/schemas/ShortText'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantId'
          minItems: 1
          maxItems: 100
          description: A swimlane has a set of tenants, not exactly one (Q34).
        agent:
          $ref: '#/components/schemas/AgentStatus'
        last_scan_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        base_version:
          oneOf:
          - $ref: '#/components/schemas/VersionLabel'
          - type: 'null'
        drift_counts:
          type: array
          items:
            type: array
            prefixItems:
            - $ref: '#/components/schemas/DriftState'
            - type: integer
              minimum: 0
            minItems: 2
            maxItems: 2
          maxItems: 16
        finding_count:
          type: integer
          minimum: 0
        tier:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
          description: The environment tier of the swimlane, such as `SIT` or `UAT`, null when none is set. Absent when
            null.
        project:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
          description: The display name of the project the swimlane belongs to, null when it has none. Absent when null.
        baseline:
          oneOf:
          - $ref: '#/components/schemas/BaselineStatus'
          - type: 'null'
          description: Whether the baseline is adopted. `unconfirmed` means no baseline and editing is locked,
            `in_progress` means an open adoption (one that is being worked through or waits for review), and
            `confirmed` means the baseline is adopted and editing is unlocked. The registry states it for every
            swimlane; it is absent only in a response from a server that predates this field.
        pickup_counts:
          type: array
          items:
            type: array
            prefixItems:
            - $ref: '#/components/schemas/PickupState'
            - type: integer
              minimum: 0
            minItems: 2
            maxItems: 2
          maxItems: 3
          description: How many services are in each pickup state that is not `live`, as pairs of a state and a count. It
            equals what `listPendingRestarts` counts per state for this swimlane, and it is an aggregate worked out for
            all swimlanes at once, so the list never needs one call per swimlane. Only non-zero states are listed, each
            once. Absent when nothing is waiting.
        syncing:
          oneOf:
          - $ref: '#/components/schemas/SyncingInfo'
          - type: 'null'
          description: The sync window that is open on the swimlane now, null when none is. Absent when null.
      additionalProperties: false
      required:
      - id
      - display_name
      - tenants
      - agent
      - last_scan_at
      - base_version
      - drift_counts
      - finding_count
    UserRef:
      type: object
      description: A person, as any signed-in user may see them. The id and the display name Entra gave them, and never an
        email address.
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        display_name:
          $ref: '#/components/schemas/ShortText'
      additionalProperties: false
      required:
      - id
      - display_name
    BaselineState:
      type: string
      enum:
      - unconfirmed
      - in_progress
      - confirmed
      description: Where the baseline of a swimlane stands. `in_progress` means an adoption is open and the baseline is not
        confirmed yet.
    BaselineStatus:
      type: object
      description: The baseline of a swimlane, and once it is confirmed, who confirmed it and when.
      properties:
        state:
          $ref: '#/components/schemas/BaselineState'
        by:
          oneOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
          description: Who confirmed the baseline. Null unless the state is `confirmed`.
        at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When the baseline was confirmed. Null unless the state is `confirmed`.
      additionalProperties: false
      required:
      - state
      - by
      - at
    SyncingInfo:
      type: object
      description: A sync window that is open on a swimlane. The Job that is syncing it and when the window opened.
      properties:
        job:
          $ref: '#/components/schemas/JobRef'
        since:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
      required:
      - job
      - since
    ServiceRef:
      type: object
      properties:
        namespace:
          type: string
          pattern: ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$
      additionalProperties: false
      required:
      - namespace
      - name
    RestartOffer:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRef'
          maxItems: 2000
          description: The services to restart, at most 2,000, in order of namespace and name.
        truncated:
          type: boolean
          description: There are more services than `services` holds. Restarting these leaves the others as they are,
            so the confirmation must say that the list is not the whole of it.
      additionalProperties: false
      required:
      - services
      - truncated
    ConfigServerRestartOffer:
      type: object
      properties:
        service:
          $ref: '#/components/schemas/ServiceRef'
          description: The config-server's Deployment, which is what the restart request names.
        affected:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRef'
          maxItems: 2000
          description: Every other service of the swimlane. They all ask the config-server for their files (D82), so
            none of them can be served while it restarts.
        truncated:
          type: boolean
          description: The swimlane has more services than `affected` lists, so the list is not the whole of it.
      additionalProperties: false
      required:
      - service
      - affected
      - truncated
    ConfigServerRestartOfferResult:
      type: object
      properties:
        offer:
          oneOf:
          - $ref: '#/components/schemas/ConfigServerRestartOffer'
          - type: 'null'
          description: Null when check C11 is not open for the swimlane, or when the cluster report lists no Deployment
            with the configured config-server name or several of them.
      additionalProperties: false
      required:
      - offer
    ServiceState:
      type: object
      properties:
        service:
          $ref: '#/components/schemas/ServiceRef'
        pickup:
          $ref: '#/components/schemas/PickupState'
        pending_since:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        live_by:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        notifications_enabled:
          type: boolean
        cache_ttl_secs:
          type: integer
          minimum: 0
        pending_files:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          maxItems: 500
      additionalProperties: false
      required:
      - service
      - pickup
      - pending_since
      - live_by
      - notifications_enabled
      - cache_ttl_secs
      - pending_files
    SwimlaneDetail:
      allOf:
      - $ref: '#/components/schemas/SwimlaneSummary'
      - type: object
        properties:
          services:
            type: array
            items:
              $ref: '#/components/schemas/ServiceState'
            maxItems: 500
          auto_notify:
            type: boolean
        additionalProperties: false
        required:
        - services
        - auto_notify
    FileContent:
      type: object
      properties:
        path:
          $ref: '#/components/schemas/NfsPath'
        hash:
          $ref: '#/components/schemas/ContentHash'
        class:
          $ref: '#/components/schemas/FileClass'
        format:
          $ref: '#/components/schemas/FileFormat'
        size:
          type: integer
          minimum: 0
        content_withheld:
          type: boolean
