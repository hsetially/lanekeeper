  /api/v1/me/github-token:
    get:
      operationId: getGithubCredential
      summary: What is stored of my GitHub token
      description: The user's own credential, as `putGithubToken` answers it, so that the token page can show who it
        belongs to, when it was verified and when it expires. It is never the token. A user with no stored token gets
        404. The answer is never cached.
      tags:
