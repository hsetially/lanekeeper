            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          updated_by:
            oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
          dry_run_preview:
            oneOf:
            - $ref: '#/components/schemas/RetentionPreview'
            - type: 'null'
        additionalProperties: false
        required:
        - updated_at
        - updated_by
        - dry_run_preview
