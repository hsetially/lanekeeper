      x-required-role: editor
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putGithubToken
      summary: Store or replace my GitHub token
      description: Verified against GitHub, then stored envelope-encrypted with the user and credential ids as associated
        data (S7). The response never contains the token.
      tags:
      - me
      x-required-role: editor
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |-
            The token was refused. Match on `type`: `classic_token` and `not_fine_grained_token` (the policy allows only fine-grained tokens), `token_rejected` (GitHub does not accept it), `token_missing_access` (it cannot push to both repositories), `github_account_mismatch` (it belongs to another GitHub account than the one linked to the user), `token_expired` and `token_unreadable` (the stored token cannot be used), or `idempotency_conflict`.

            Only `token_missing_access` carries more than the common fields: `base` and `tenant` say whether the token can push to the base and to the tenant repository. Every other refusal is a plain `Problem`, so the schema is a union, not the one extension.
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TokenMissingAccessProblem'
                - $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGithubToken
      summary: Remove my GitHub token
      tags:
      - me
      x-required-role: editor
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Done. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
