        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/swimlanes/{id}/restart-offer:
    get:
      operationId: getRestartOffer
      summary: The services a restart-all confirmation lists for a change
      description: What the confirmation of "restart all" shows (D49) for a change to `path`. A file in the root folder
        is read by every service (D82), so the offer lists every service of the swimlane. A file in an application's
        folder is read by that application only, so the offer lists its Deployments. The screen restarts them one
        request at a time with `restartService`. Operator only, like the restart.
      tags:
      - writes
      x-required-role: operator
      parameters:
      - $ref: '#/components/parameters/SwimlaneId'
      - name: path
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/NfsPath'
        description: The file whose change calls for the restart.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartOffer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/swimlanes/{id}/served:
    get:
      operationId: getServedFile
      summary: A file as the config-server serves it
      tags:
      - swimlanes
      - content
      x-required-role: viewer
      parameters:
      - $ref: '#/components/parameters/SwimlaneId'
      - name: application
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/AppName'
      - name: tenant
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TenantId'
      - name: channel
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChannelName'
      - name: file
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/NfsPath'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServedFile'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          description: 'Not modified: the ETag matched.'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/swimlanes/{id}/tree:
    get:
      operationId: listSwimlaneTree
      summary: List files below a folder
      tags:
      - swimlanes
      x-required-role: viewer
      parameters:
      - $ref: '#/components/parameters/SwimlaneId'
      - name: prefix
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NfsPath'
        description: Folder to list; the root when absent.
      - name: drift
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DriftState'
        description: Only entries in this drift state.
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /auth/callback:
    get:
      operationId: authCallback
      summary: Finish the Entra sign-in
      description: 'Open by design: the state and nonce checks authenticate the response (S1).'
      tags:
      - auth
      x-required-role: none
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          maxLength: 4096
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 512
      responses:
        '302':
          description: Session cookie set; redirect to the web app. A first sign-in creates a pending user and an
            access request (D36).
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: '`__Host-lk_session` (HttpOnly, Secure, SameSite=Lax, Path=/, no Domain) and `__Host-lk_csrf`.'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /auth/login:
    get:
      operationId: authLogin
      summary: Start the Entra sign-in
      description: No session exists yet, so this operation is open by design (S1).
      tags:
      - auth
      x-required-role: none
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
          pattern: ^/[^/\\].*$|^/$
        description: A path inside the web app to return to after sign-in. Never an absolute URL.
      responses:
        '302':
          description: Redirect to Microsoft Entra ID with state, nonce and PKCE.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: Short-lived sign-in state cookie.
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /auth/logout:
    post:
      operationId: authLogout
      summary: End the session
      description: 'Open by design: with no session there is nothing to end. A request with a session must pass
        the CSRF check.'
      tags:
      - auth
      x-required-role: none
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /hooks/github:
    post:
      operationId: githubWebhook
      summary: GitHub webhook
      description: No session. Verified by HMAC over the raw body with a constant-time comparison, plus delivery-id
        replay protection (S3, S4).
      tags:
      - hooks
      x-required-role: none
      parameters:
      - name: X-Hub-Signature-256
        in: header
        required: true
        schema:
          type: string
          pattern: ^sha256=[0-9a-f]{64}$
      - name: X-GitHub-Event
        in: header
        required: true
        schema:
          type: string
          enum:
          - push
          - pull_request
          - ping
      - name: X-GitHub-Delivery
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's payload. Only the fields the hub reads are interpreted; the body is limited
                to 1 MiB.
      responses:
        '202':
          description: Accepted. Replays of a delivery id are acknowledged and ignored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          $ref: '#/components/responses/Error'
      security: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-lk_session
      description: HttpOnly, Secure, SameSite=Lax session cookie set by `/auth/callback` (S2).
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
      description: 'Double-submit token (S3): the value of the `__Host-lk_csrf` cookie. The server also checks that `Origin`
        is the public origin.'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,128}$
      description: Chosen by the client for each logical write. The same key with the same request returns the stored
        response; the same key with a different request returns 422. Kept 24 hours.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
      description: An ETag from an earlier response. A match returns 304 with no body.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
      description: The `next` value of the previous page. Absent for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Page size, at most 500.
    SwimlaneId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SwimlaneId'
    SwimlaneParam:
      name: swimlane
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SwimlaneId'
    ConfigKey:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConfigKey'
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    ETag:
      description: Strong validator. For content it is derived from content hashes.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before the request is tried again.
      schema:
        type: integer
        minimum: 0
        maximum: 86400
  responses:
    BadRequest:
      description: The request is malformed or a parameter failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The user is pending or disabled, lacks the role, or failed the CSRF or Origin check.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource, or the user may not know it exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The expected hash or version did not match. Nothing was written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictProblem'
    ConflictState:
      description: The request conflicts with the current state of the resource, for example a request that was
        already decided or a change that would leave no active admin. Nothing was changed. Unlike `Conflict` there is
        no expected hash, so the body carries no `current`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The body exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: A sync window or PR job holds the file.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/LockedProblem'
    TooManyRequests:
      description: A rate limit or a limit on open streams was reached. `Retry-After` says how long to wait when the
        server knows; the stream limit and the access-request cooldown send none.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A service the request depends on did not answer, such as GitHub, the key service or the store.
        Nothing was changed; the same request can be sent again after `Retry-After` seconds.
      headers:
        Retry-After:
          required: true
          description: Seconds to wait before the request is tried again.
          schema:
            type: integer
            minimum: 0
            maximum: 86400
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Any other error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The content is invalid, the request is not allowed, or the Idempotency-Key was reused with a
        different request. Write rejections add `reason`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SwimlaneId:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,62}$
      description: Lower case letters, digits and hyphens, at most 63 characters.
    TenantId:
      type: string
      pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
      description: Equals the tenant Git branch name.
    ContentHash:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: SHA-256 of the content, 64 lower case hex characters.
    NfsPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: Relative path below the swimlane's NFS root. No leading slash, no `..`, no backslash or control
        characters. The server parses it with NfsPath.
    LogicalFile:
      type: string
      minLength: 1
      maxLength: 1024
      description: A base-relative path without the tenant suffix, such as `tx-infinity-api/tx-infinity-core.yml`.
    RepoPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: A path inside a Git repository, relative to its root.
    SettingPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: A flattened setting path such as `a.b.c` or `a.b[0]`, optionally prefixed `#<doc>/`.
    DocPath:
      type: string
      minLength: 1
      maxLength: 1024
      description: 'A path in the docs filesystem: `/git/<branch>/<path>` or `/uploads/<name>`.'
    ChannelName:
      type: string
      pattern: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$
    AppName:
      type: string
      pattern: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$
    GitRef:
      type: string
      minLength: 1
      maxLength: 255
      description: A branch, tag or 40/64 character commit id.
    CommitId:
      type: string
      pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
    UserId:
      type: string
      pattern: ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}:[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$
      description: '`<Entra tenant id>:<Entra object id>`.'
    Timestamp:
      type: integer
      format: int64
      description: Milliseconds since the Unix epoch.
    ShortText:
      type: string
      maxLength: 256
    Cursor:
      type: string
      pattern: ^[A-Za-z0-9_=.-]{1,512}$
      description: Opaque keyset cursor. Pass the `next` of the previous page.
    CompareRef:
      type: string
      maxLength: 300
      pattern: ^((nfs|baseline|effective):[a-z0-9][a-z0-9-]{0,62}|git:(base|tenant)@.{1,255})$
      description: 'One side of a comparison: `nfs:<swimlane>`, `baseline:<swimlane>`, `effective:<swimlane>`, `git:base@<ref>`
        or `git:tenant@<ref>`.'
      examples:
      - nfs:sit1
      - git:base@v2.3.1
    ConfigKey:
      type: string
      pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
      description: Identifier of an admin-managed setting row.
    DraftId:
      type: string
      pattern: ^[A-Za-z0-9._-]{1,128}$
    LineRange:
      type: object
      properties:
        start:
          type: integer
          minimum: 1
        end:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - start
      - end
      description: 1-based, inclusive.
    Role:
      type: string
      enum:
      - viewer
      - editor
      - operator
      - admin
      description: 'Ordered: viewer < editor < operator < admin.'
    UserStatus:
      type: string
      enum:
      - pending
      - active
      - disabled
    FileKind:
      type: string
      enum:
      - base
      - tenant
      - untracked
    FileClass:
      type: string
      enum:
      - structured
      - text
      - binary
      - denied
      description: '`denied` files are known by name, size and hash only (D79).'
    EolStyle:
      type: string
      enum:
      - lf
      - crlf
      - mixed
    TextEncoding:
      type: string
      enum:
      - utf8
      - utf16le
      - utf16be
      - latin1
    MergeMode:
      type: string
      enum:
      - whole_file
      - spring_merge
    DriftState:
      type: string
      enum:
      - in_sync
      - git_ahead
      - nfs_ahead
      - conflict
      - unknown
      - untracked
      - intentional_divergence
    ProposalStatus:
      type: string
      enum:
      - draft
      - pending
      - approved
      - rejected
      - stale
      - expired
      - applied
    ProposalAction:
      type: string
      enum:
      - edit
      - upload
      - delete
      - revert
      - restart
      - pr
      - notify
      description: What a proposal is for. A `restart` proposal has one path, `namespace/name` of the service.
    ProposalVia:
      type: string
      enum:
      - ui
      - mcp
      description: How the request reached the write path.
    FindingKind:
      type: string
      enum:
      - missed_base_changes
      - redundant_tenant_file
      - uneven_tenant_files
      - orphan_file
      - drift
      - environment_host_mismatch
      - overwritten_nfs_change
      - duplicate_keys
      - ambiguous_file_name
      - unresolved_placeholder
      - config_server_restart_required
      - served_mismatch
      description: Checks C1 to C11, in order, then C12, the "as served" mismatch of D86.
    FileRole:
      type: string
      enum:
      - property_source
      - resource
    PickupState:
      type: string
      enum:
      - live
      - live_within_ttl
      - needs_notify_or_restart
      - needs_config_server_restart
      description: When a change takes effect for a consuming service (D85). There is no bare pending-restart state.
    RepoKind:
      type: string
      enum:
      - base
      - tenant
    AttributionSource:
      type: string
      enum:
      - tool_write
      - sentinel_login
      - sync_job
      - nfs_client
      - fs_owner_hint
      - unknown
      description: Strongest evidence first (D73).
    Confidence:
      type: string
      enum:
      - low
      - medium
      - high
      - certain
    Severity:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    ObservationSource:
      type: string
      enum:
      - scan
      - tool_write
      - sync
    AgentStatus:
      type: string
      enum:
      - connected
      - disconnected
      - never_seen
    PrState:
      type: string
      enum:
      - open
      - merged
      - closed
    PrJobState:
      type: string
      enum:
      - pending
      - preparing
      - committing
      - opening
      - completed
      - failed
    EventKind:
      type: string
      enum:
      - file_observed
      - drift_changed
      - findings_changed
      - pending_restart_changed
      - proposal_changed
      - agent_status_changed
      - git_head_moved
      - access_request_created
      - doc_indexed
      - resync
      - attribution_updated
      - pr_state_changed
      - pr_job_progress
      - sync_window_opened
      - sync_window_closed
      - pickup_changed
    JobRef:
      type: object
      description: A Kubernetes Job, as the sync-window events name it. `ActorJob.job` has the same shape.
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$
          description: The name of the Job, a Kubernetes name of at most 253 characters.
        uid:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9-]{1,64}$
          description: The uid of the Job.
      additionalProperties: false
      required:
      - name
      - uid
    DomainEvent:
      description: One event of the live stream, the JSON of the `data:` line of a frame of `GET /api/v1/events`. The
        `type` tells the kinds apart; it is the `event:` name of the frame and a value of `EventKind`. An event carries
        ids and hashes only, never file content (S12), so a client refetches what the event names. Every field of a kind
        is present on every event; a field that can be empty is `null`, never absent. `user_sessions_revoked` is internal
        and never streamed, so it is not here.
      oneOf:
      - $ref: '#/components/schemas/DomainEventFileObserved'
      - $ref: '#/components/schemas/DomainEventDriftChanged'
      - $ref: '#/components/schemas/DomainEventFindingsChanged'
      - $ref: '#/components/schemas/DomainEventPendingRestartChanged'
      - $ref: '#/components/schemas/DomainEventProposalChanged'
      - $ref: '#/components/schemas/DomainEventAgentStatusChanged'
      - $ref: '#/components/schemas/DomainEventGitHeadMoved'
      - $ref: '#/components/schemas/DomainEventAccessRequestCreated'
      - $ref: '#/components/schemas/DomainEventDocIndexed'
      - $ref: '#/components/schemas/DomainEventResync'
      - $ref: '#/components/schemas/DomainEventAttributionUpdated'
      - $ref: '#/components/schemas/DomainEventPrStateChanged'
      - $ref: '#/components/schemas/DomainEventPrJobProgress'
      - $ref: '#/components/schemas/DomainEventSyncWindowOpened'
      - $ref: '#/components/schemas/DomainEventSyncWindowClosed'
      - $ref: '#/components/schemas/DomainEventPickupChanged'
      discriminator:
        propertyName: type
        mapping:
          file_observed: '#/components/schemas/DomainEventFileObserved'
          drift_changed: '#/components/schemas/DomainEventDriftChanged'
          findings_changed: '#/components/schemas/DomainEventFindingsChanged'
          pending_restart_changed: '#/components/schemas/DomainEventPendingRestartChanged'
          proposal_changed: '#/components/schemas/DomainEventProposalChanged'
          agent_status_changed: '#/components/schemas/DomainEventAgentStatusChanged'
          git_head_moved: '#/components/schemas/DomainEventGitHeadMoved'
          access_request_created: '#/components/schemas/DomainEventAccessRequestCreated'
          doc_indexed: '#/components/schemas/DomainEventDocIndexed'
          resync: '#/components/schemas/DomainEventResync'
          attribution_updated: '#/components/schemas/DomainEventAttributionUpdated'
          pr_state_changed: '#/components/schemas/DomainEventPrStateChanged'
          pr_job_progress: '#/components/schemas/DomainEventPrJobProgress'
          sync_window_opened: '#/components/schemas/DomainEventSyncWindowOpened'
          sync_window_closed: '#/components/schemas/DomainEventSyncWindowClosed'
          pickup_changed: '#/components/schemas/DomainEventPickupChanged'
    DomainEventFileObserved:
      type: object
      description: A file version was seen, by a scan, a tool write or a sync.
      properties:
        type:
          type: string
          const: file_observed
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        path:
          $ref: '#/components/schemas/NfsPath'
        hash:
          $ref: '#/components/schemas/ContentHash'
        source:
          $ref: '#/components/schemas/ObservationSource'
      additionalProperties: false
      required:
      - type
      - swimlane
      - path
      - hash
      - source
    DomainEventDriftChanged:
      type: object
      description: The drift state of these paths changed.
      properties:
        type:
          type: string
          const: drift_changed
        swimlane:
          $ref: '#/components/schemas/SwimlaneId'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/NfsPath'
          maxItems: 1000
      additionalProperties: false
      required:
      - type
      - swimlane
      - paths
