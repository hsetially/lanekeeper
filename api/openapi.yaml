      - name
      - webhook_configured
      - min_severity
      - kinds
      - enabled
    RetentionPreview:
      type: object
      properties:
        versions_to_delete:
          type: integer
          minimum: 0
        bytes_to_free:
          type: integer
          minimum: 0
        versions_kept_by_reference:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - versions_to_delete
      - bytes_to_free
      - versions_kept_by_reference
    RetentionInput:
      type: object
      properties:
        keep_last_versions:
          type: integer
          minimum: 1
          maximum: 10000
          description: Per file (default 50).
        keep_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Default 180 (Q33).
      additionalProperties: false
      required:
      - keep_last_versions
      - keep_days
      description: Baselines and versions referenced by audit events, proposals, drafts or PR links are always kept
        (D78).
    RetentionSettings:
      allOf:
      - $ref: '#/components/schemas/RetentionInput'
