          format: int64
          minimum: 1
        label:
          type: string
          minLength: 1
          maxLength: 64
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
