  /api/v1/blobs/{hash}:
    get:
      operationId: getBlob
      summary: Content by hash
      description: Never serves denied or withheld files (404).
      tags:
      - content-store
      - content
      x-required-role: viewer
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 'The bytes. Immutable: the hash is the ETag and the content never changes.'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              schema:
                type: string
                enum:
                - private, max-age=31536000, immutable
              description: 'Private: only for signed-in users, never a shared cache.'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: 'Not modified: the ETag matched.'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
