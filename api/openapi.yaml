    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        seq:
          type: integer
          format: int64
        at:
          $ref: '#/components/schemas/Timestamp'
        action:
          $ref: '#/components/schemas/ShortText'
        actor:
          oneOf:
          - $ref: '#/components/schemas/UserId'
          - type: 'null'
        via:
          type: string
          enum:
          - ui
          - mcp
          - system
        swimlane:
          oneOf:
          - $ref: '#/components/schemas/SwimlaneId'
          - type: 'null'
        target:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
        request_id:
          oneOf:
          - $ref: '#/components/schemas/ShortText'
          - type: 'null'
        attribution:
          oneOf:
          - $ref: '#/components/schemas/Attribution'
          - type: 'null'
        diff:
          oneOf:
          - type: string
            description: The change's own diff text, kept so evidence survives blob garbage collection (D78).
          - type: 'null'
        prev_hash:
          $ref: '#/components/schemas/ContentHash'
        hash:
          $ref: '#/components/schemas/ContentHash'
      additionalProperties: false
      required:
      - id
      - seq
      - at
      - action
      - actor
      - via
      - swimlane
      - target
      - request_id
      - attribution
      - diff
      - prev_hash
      - hash
      description: One link of the tamper-evident audit chain (S9).
