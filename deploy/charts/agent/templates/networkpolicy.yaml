# Default deny for the agent's pod, and the five places it talks to (crates/agent/HARDENING.md, S17, S18): the hub and the Kubernetes
# API server by address, the config-server's pods in this namespace, the metadata server and kube-dns. Both policy types are set, so
# everything not listed is denied. network.rego checks the rendering, and contract.rego that it equals HARDENING.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lanekeeper-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lanekeeper-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus, on the health port. The kubelet's probes come from the node.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.network.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 9090}
  egress:
    # The hub: the gRPC stream (S6) and Join.
    - to:
        {{- range .Values.network.hubAddresses }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    # The Kubernetes API server: watches, restarts and the Secrets (crates/agent/RBAC.md).
    - to:
        {{- range .Values.network.kubeApiAddresses }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    # NotifyConfigServer and FetchServed, only when the hub asks. The endpoint has no authentication (Q37), which is why nothing else
    # may reach it from here, and why the hub requires the Operator role and audits the call.
    - to:
        - podSelector:
            matchLabels:
              app: csp-configuration-server
      ports:
        - {protocol: TCP, port: 8888}
    # The GKE metadata server, for the Workload Identity token (S5).
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
