apiVersion: v1
kind: ServiceAccount
metadata:
  name: lanekeeper-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    # Workload Identity (S5, Q26): the agent proves who it is to the hub with the ID token of this Google service account.
    iam.gke.io/gcp-service-account: {{ . | quote }}
  {{- end }}
# The agent is a Kubernetes client (it watches workloads, patches the restart annotation and updates its certificate Secret), so
# its token is mounted. Its Roles are crates/agent/RBAC.md and nothing wider.
automountServiceAccountToken: true
