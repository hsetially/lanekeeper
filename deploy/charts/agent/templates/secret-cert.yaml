# The agent's certificate Secret, empty (crates/agent/RBAC.md). The agent may update it but cannot create it (`create` cannot be limited
# by name), so the chart makes it; the agent writes tls.crt and tls.key into it when it joins and when it renews (S5). `keep` leaves
# it alone when the release is removed or upgraded, and ArgoCD ignores its data (plan 09 A14, T6). Opaque, because the API server
# refuses an empty kubernetes.io/tls Secret.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: lanekeeper-agent-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
