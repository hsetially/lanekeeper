{{- if .Values.storage.cmekKey }}
# Encrypts the mirror disks with the customer-managed key (S10). The Compute Engine service agent needs
# cloudkms.cryptoKeyEncrypterDecrypter on the key (charts/gcp, cmek.diskKeys; render.sh checks that it has it).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lanekeeper-hub-cmek
  labels:
    {{- include "lanekeeper-hub.labels" . | nindent 4 }}
provisioner: pd.csi.storage.gke.io
parameters:
  type: {{ .Values.storage.diskType }}
  disk-encryption-kms-key: {{ .Values.storage.cmekKey | quote }}
# The volume is made where the pod is, in its zone.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# The mirror is a cache of Git; a lost volume is a full re-fetch.
reclaimPolicy: Delete
{{- end }}
