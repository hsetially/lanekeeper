apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-hub.labels" . | nindent 4 }}
  annotations:
    # Workload Identity (S5, S7): Secret Manager, KMS, GCS and Cloud Trace are reached as this Google service account.
    iam.gke.io/gcp-service-account: {{ required "serviceAccount.gcpServiceAccount is required (Workload Identity)" .Values.serviceAccount.gcpServiceAccount | quote }}
# The hub never calls the Kubernetes API, so no token is mounted (S16).
automountServiceAccountToken: false
