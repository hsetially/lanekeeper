# The replicas find one another through this headless Service: lanekeeper-hub-0.lanekeeper-hub-replicas.<namespace>.svc, which is
# what agent_connections.replica_address holds (D62). Only the replica port; nothing else needs a per-pod name.
apiVersion: v1
kind: Service
metadata:
  name: lanekeeper-hub-replicas
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-hub.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "lanekeeper-hub.selectorLabels" . | nindent 4 }}
  ports:
    - name: replica
      port: 8445
      targetPort: replica
      protocol: TCP
---
# Behind the Gateway (and Cloud Armor) and inside the cluster. ClusterIP: the only public doors are the Gateway and the agent
# load balancer (network.rego fails any other public Service). The listener speaks HTTPS, so the load balancer is told so.
apiVersion: v1
kind: Service
metadata:
  name: lanekeeper-hub-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lanekeeper-hub.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: 443
      targetPort: web
      protocol: TCP
      appProtocol: HTTPS
{{- if .Values.agentLoadBalancer.enabled }}
{{- include "lanekeeper-hub.requireRanges" (list "network.agentSourceRanges" .Values.network.agentSourceRanges) }}
---
# The agents' entry point (D25): a TCP pass-through load balancer. The agents authenticate with mTLS at the pod, so nothing is
# terminated on the way. Local keeps the clients' addresses, which is what the source allowlist and the NetworkPolicy see (S18).
# The allowlist is the clusters' outbound IPs (Q1) and the NFS VM's (plan 09 A28).
# It listens on 443, the port the agents dial (crates/agent/HARDENING.md), and forwards to the container port named agent, 8444
# (crates/hub/HARDENING.md), which the NetworkPolicy admits. The NFS VM's sentinel reaches the same 443 (plan 09 B7, decided by a
# human on 2026-10-26: the Service changes and neither contract file does).
apiVersion: v1
kind: Service
metadata:
  name: lanekeeper-hub-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-hub.labels" . | nindent 4 }}
  {{- with .Values.agentLoadBalancer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  {{- with .Values.agentLoadBalancer.ipAddress }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  loadBalancerSourceRanges:
    {{- range .Values.network.agentSourceRanges }}
    - {{ . | quote }}
    {{- end }}
  selector:
    {{- include "lanekeeper-hub.selectorLabels" . | nindent 4 }}
  ports:
    - name: agent
      port: 443
      targetPort: agent
      protocol: TCP
{{- end }}
