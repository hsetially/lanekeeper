# The account the hub image's Jobs run as: not the hub's (that one has a Google identity, Secret Manager and KMS, which a Job must not have), and
# with no token (S16). It is a hook of the same events as the migration Job, with a lower weight, because on a first install a pre-install hook
# runs before the rest of the chart exists, and the Job needs its account then; it is kept for the seed Job, which is not a hook
# (jobHook in _helpers.tpl). deploy/policy/hardening.rego holds the Jobs to all of it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lanekeeper-hub-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lanekeeper-hub.jobLabels" (list . "jobs") | nindent 4 }}
  annotations:
    {{- include "lanekeeper-hub.jobHook" "-10" | nindent 4 }}
automountServiceAccountToken: false
