{{- /*
The Secret Manager secrets the hub reads (09/fix, I1; S7): containers only, never a value, never a version. A person puts each value in
(README.md), and the hub's account may read each secret it needs (iam.yaml: one secretAccessor binding on each, never on the project).
The names are the hub chart's config.secretManager.* and the constants of the hub's code (crates/hub/HARDENING.md); render.sh contract
compares them with the hub chart, so that the two cannot disagree. Teams webhook secrets are named at run time by an administrator and are
not made here.

Every container is replicated into one location, the chart's, and encrypted with the customer-managed key `secrets.cmekKey` (S10, Q29), in
that location: a regional key needs a replica in its own region (not verified). Without a key the container falls back to Google-managed
encryption, with a warning from the policy that render.sh fails for prod and staging. None is deleted from Google Cloud when its Kubernetes
resource is removed, and Argo CD does not prune it: a secret that goes takes every version a person put in with it.
*/ -}}
{{- $project := required "project is required: the Google Cloud project of the Config Connector resources" .Values.project }}
{{- $location := required "location is required: the region of the secrets" .Values.location }}
{{- $env := include "lanekeeper-gcp.environment" . }}
{{- $key := include "lanekeeper-gcp.key" (list "secrets.cmekKey" .Values.secrets.cmekKey $location "secret") }}
{{- range $name := include "lanekeeper-gcp.secretNames" . | fromJsonArray }}
---
apiVersion: secretmanager.cnrm.cloud.google.com/v1beta1
kind: SecretManagerSecret
metadata:
  {{- include "lanekeeper-gcp.keptMeta" (dict "root" $ "name" $name "purpose" "secret" "project" $project "env" $env "fallback" (not $key)) | nindent 2 }}
spec:
  replication:
    userManaged:
      replicas:
        - location: {{ $location }}
          {{- if $key }}
          customerManagedEncryption:
            kmsKeyRef:
              external: {{ $key }}
          {{- end }}
{{- end }}
