# The Google Cloud resources of prod (09/T3: Cloud Armor; T5: buckets, keys and IAM). Documentation addresses and an example project until Q2 is answered (the GlobalProtect egress
# ranges) and the project is named (rule 12: nothing real in the repository).
project: example-project
# EXAMPLE number (the project's number, not its id): Google's service agents are named by it.
projectNumber: "123456789012"
environment: prod
# EXAMPLE location (Q29): a customer-managed key must be in the same one.
location: example-location

cloudArmor:
  policyName: lanekeeper-hub-prod
  # EXAMPLE (Q2).
  usersRanges:
    - 192.0.2.0/24

# EXAMPLE names and keys (Q29: the key ring is not chosen yet). A bucket name is global to Google Cloud.
buckets:
  backup:
    name: example-project-lanekeeper-backup-prod
    cmekKey: projects/example-project/locations/example-location/keyRings/lanekeeper/cryptoKeys/lanekeeper-backup-prod
  auditCheckpoint:
    name: example-project-lanekeeper-audit-prod
    cmekKey: projects/example-project/locations/example-location/keyRings/lanekeeper/cryptoKeys/lanekeeper-audit-prod
    # Plan 09 A19, decided by a human on 2026-10-26: three months (90 days = 7,776,000 s); the lock cannot be undone.
    retentionPeriodSeconds: 7776000
    isLocked: true
  docs:
    name: example-project-lanekeeper-docs-prod
    cmekKey: projects/example-project/locations/example-location/keyRings/lanekeeper/cryptoKeys/lanekeeper-docs-prod

cmek:
  diskKeys:
    # The key of the hub's mirror disks (charts/hub storage.cmekKey) and of the database's (charts/db storage.cmekKey).
    - projects/example-project/locations/example-location/keyRings/lanekeeper/cryptoKeys/lanekeeper-disk-prod

# The hub's keys and the secrets it reads (09/fix, I1). EXAMPLE names, the ones that deploy/values/hub/prod.yaml's config.kms.* name (render.sh
# contract compares them): the key ring is not chosen yet (Q29), and a key ring cannot be deleted once it is made. The hub's keys are HSM keys.
kms:
  keyRing: lanekeeper
  protectionLevel: HSM
  keys:
    agentCa: lanekeeper-agent-ca-prod
    replicaCa: lanekeeper-replica-ca-prod
    auditCheckpoint: lanekeeper-audit-checkpoint-prod
    vault: lanekeeper-vault-prod

secrets:
  # EXAMPLE key (Q29), a key of its own in the ring of the other customer-managed keys. The Secret Manager service agent is given use of it.
  cmekKey: projects/example-project/locations/example-location/keyRings/lanekeeper/cryptoKeys/lanekeeper-secrets-prod

# Admission (09/T6, plan 09 A5): images that CI did not sign. DRYRUN_AUDIT_LOG_ONLY audits and does not block, until Q24 (is Binary
# Authorization available on the clusters?) is answered; ENFORCED_BLOCK_AND_AUDIT_LOG blocks, and read charts/gcp/README.md ("Admission") first.
# The public key of the CI signing key is NOT here: the key does not exist until a person makes it in Cloud KMS, and the chart refuses to
# render until its public half is put in as binaryAuthorization.publicKeys (the README shows how). It is never typed in or invented.
binaryAuthorization:
  enforcementMode: DRYRUN_AUDIT_LOG_ONLY
