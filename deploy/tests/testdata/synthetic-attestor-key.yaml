# SYNTHETIC test data (09/T6). Not the CI signing key, and it trusts nothing: the key pair was made on 2026-10-25 by
# `openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 | openssl pkey -pubout`, the private key was never written to disk,
# and no signature can ever verify against this public key. deploy/tests/render.sh layers this file over the gcp chart's values,
# because the chart refuses to render without the public key of the CI signing key and the committed values files do not carry one
# (that key is made in Cloud KMS by a person, and its public half is put into the values by whoever makes it; see "Admission" in
# deploy/charts/gcp/README.md). The key version is an example name, like the project and the key ring in the values.
binaryAuthorization:
  publicKeys:
    - keyVersion: projects/example-project/locations/example-location/keyRings/lanekeeper/cryptoKeys/lanekeeper-ci-cosign/cryptoKeyVersions/1
      signatureAlgorithm: ECDSA_P256_SHA256
      publicKeyPem: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAERM+mzO2UnKpik7yzIC9TGU3dK1LA
        I4sALn4Knjtcr4qLEKSuVj3EAVW7ny5nBPUrQAljkAjQOtdQW1p1K14cAw==
        -----END PUBLIC KEY-----
