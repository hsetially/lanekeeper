# Local development only. Never used in any shared environment.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lanekeeper
      POSTGRES_PASSWORD: lanekeeper-dev-only
      POSTGRES_DB: lanekeeper
    ports: ["127.0.0.1:5432:5432"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
volumes:
  pgdata: {}
