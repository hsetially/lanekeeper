# The audisp af_unix plugin, for the Lanekeeper sentinel (09/T8; S25, D72, plan 09 A17). Installed as
# /etc/audit/plugins.d/lanekeeper-af_unix.conf, beside the audit package's own af_unix.conf (which stays inactive). auditd (audit 3.x on
# Rocky Linux 8: the plugins are loaded by auditd itself) starts the plugin, and the plugin hands every audit record, as a line of text,
# to whoever connects to the socket below. The sentinel connects; it never reads /var/log/audit.
#
# WHO CAN READ THE SOCKET. The socket is made by a plugin that runs as root and cannot be given a group, so the access control is the
# directory: /run/lanekeeper-audisp is root:lanekeeper-sentinel, mode 0750 (tmpfiles.d/lanekeeper-sentinel.conf), and only root and the
# sentinel's group can reach a name inside it. The socket's own mode is therefore open (0666: connecting to a unix socket needs write
# permission on it), and the directory is what keeps everyone else out. Nothing else may be put in that directory. A mode of 0660 would
# lock the sentinel out, because the socket belongs to root:root. Prompt 17 confirms this against the daemon on Rocky 8.9 and 8.10.
#
# What the audit records say is metadata: paths, operations, times, user ids and executable names (S25). The audit rule that makes them
# is audit/lanekeeper.rules.in.
active = yes
direction = out
path = /sbin/audisp-af_unix
type = always
args = 0666 /run/lanekeeper-audisp/audit.sock
format = string
