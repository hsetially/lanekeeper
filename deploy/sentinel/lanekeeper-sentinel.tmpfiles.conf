# The directory of the audisp socket (09/T8; S25, plan 09 A17), made at every boot because /run is a tmpfs. root:lanekeeper-sentinel and
# 0750: only root (the plugin) and the sentinel's group can reach the socket inside (audisp/af_unix.conf). Installed as
# /usr/lib/tmpfiles.d/lanekeeper-sentinel.conf; the package's %post makes it once at install time.
d /run/lanekeeper-audisp 0750 root lanekeeper-sentinel -
