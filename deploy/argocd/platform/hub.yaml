# The hub, in the platform cluster's Argo CD (09/T6; D23, D26, D62). The chart is deploy/charts/hub, with the prod values.
#
# targetRevision is a full commit id, never a branch or a tag, because a branch moves under a running system and a tag can be moved:
# what runs is the commit that a person put here in a reviewed change. The value below is a PLACEHOLDER (40 zeros), as the image digest
# in the values is (plan 09 A29): a commit cannot name the commit that contains it, so the id of the merge commit is put here by the next
# change (deploy/argocd/README.md, "Moving a revision"). Argo CD cannot resolve it, so nothing syncs until it is replaced, and
# deploy/policy/argocd.rego warns on every run until then.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lanekeeper-hub
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: lanekeeper
    lanekeeper.io/environment: prod
spec:
  project: lanekeeper-workloads
  source:
    repoURL: https://github.com/hsetially/lanekeeper
    targetRevision: "0000000000000000000000000000000000000000"
    path: deploy/charts/hub
    helm:
      releaseName: lanekeeper-hub
      valueFiles:
        - ../../values/hub/prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lanekeeper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
