# The embedding model baked into the hub image (D53; plan 09 A3). The hub Dockerfile's `model` stage reads this file,
# fetches each `file` from https://huggingface.co/<repo>/resolve/<revision>/<path>, and stops the build unless the size and
# sha256 match. Nothing else about the model is trusted: not the name, not the host's own checksums.
#
# Regenerate with `deploy/images/update-model-lock.sh <revision>` on a machine that can reach huggingface.co, and
# check with `node deploy/images/model-lock.mjs check deploy/images/hub-model.lock`. The revision must be at least 14 days
# old (AGENTS.md rule 15). Prompt 14 confirms the model or changes this lock.
#
# Lines: `model <dir under /app/models>`, `repo <owner/name>`, `revision <40-hex commit>`, `date <commit date, UTC>`,
# then one `file <sha256> <size in bytes> <path in the repo>` per file.
