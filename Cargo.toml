[workspace]
resolver = "3"
members = [
  "crates/domain", "crates/ports", "crates/proto", "crates/engine",
  "crates/hub-identity", "crates/hub-platform", "crates/hub-registry", "crates/hub-writes",
  "crates/hub-docsearch", "crates/hub-mcp", "crates/hub",
  "crates/agent", "crates/sentinel", "crates/xtask",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.88"

# Shared dependencies. Add them here and reference them from member crates with `dep.workspace = true`.
# Rules (AGENTS.md, rule 15): pinned versions at least 14 days old, justified in the PR, and passing `cargo deny`.
[workspace.dependencies]
# Workspace crates. The version keeps `cargo deny` from flagging them as wildcard dependencies.
domain = { path = "crates/domain", version = "0.1.0" }
ports = { path = "crates/ports", version = "0.1.0" }
engine = { path = "crates/engine", version = "0.1.0" }
proto = { path = "crates/proto", version = "0.1.0" }
xtask = { path = "crates/xtask", version = "0.1.0" }
hub-platform = { path = "crates/hub-platform", version = "0.1.0" }
hub-identity = { path = "crates/hub-identity", version = "0.1.0" }
# Every version is an exact pin, at least 14 days old when chosen (S19). Default features are off; member crates enable what they use.
# Data and errors
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
thiserror = "=2.0.20"
# Reads OpenAPI YAML in the route-guard harness and conformance tests (Q8). Pure safe Rust, maintained; serde_yaml is denied in deny.toml.
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["deserialize"] }
toml = { version = "=0.9.8", default-features = false, features = ["std", "parse", "serde"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
# Secrets and hashing (S7, S21)
secrecy = { version = "=0.10.3", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
subtle = { version = "=2.6.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
# Async runtime and ports
bytes = "=1.12.1"
futures = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
async-trait = "=0.1.92"
tokio = { version = "=1.53.1", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
# Database. No TLS feature here: sqlx's rustls roots pull webpki-roots (CDLA-Permissive-2.0), which deny.toml does not allow. 0.9 needs rustc 1.94.
sqlx = { version = "=0.8.6", default-features = false }
# gRPC. protox is a pure-Rust protobuf compiler, so no protoc binary is needed.
tonic = { version = "=0.14.6", default-features = false }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
protox = "=0.9.1"
# Duplex-channel gRPC tests in crates/proto (tonic's own transport stack, already in the graph).
tokio-stream = { version = "=0.1.19", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
tower = { version = "=0.5.3", default-features = false }
# Agent (prompt 02). cap-std keeps every agent file access inside the NFS root (S17); `http` validates the hub,
# config-server and metadata URLs at startup (it is already in the graph through tonic); `globset` validates the ignore,
# sync-Job and Helm-hint globs at startup and matches them in the walker (decision A1).
cap-std = { version = "=4.0.3", default-features = false }
http = { version = "=1.5.0", default-features = false, features = ["std"] }
globset = { version = "=0.4.20", default-features = false }
# Agent identity (T2, S5). rcgen makes the P-256 key and the CSR on aws-lc-rs (the stack's one crypto provider; `zeroize`
# wipes its key copy on drop). x509-parser reads the issued certificate so it is checked before it is stored; its
# `verify` features stay off. `pem` reads and writes the certificate Secret. kube is the Kubernetes client (the Secret
# calls in T2, the Deployment/Pod/Job watchers in T6): `rustls-tls` with `aws-lc-rs` keeps `ring` out of the agent's
# graph, and `runtime` adds the `watcher` (list, watch, backoff, paging) from kube-runtime and its small tree (backon,
# async-broadcast, json-patch, hostname, educe). kube 4.2.0 needs rustc 1.89 and the toolchain is pinned to 1.88, so
# 4.0.0 (2026-06-16) is the newest that builds.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "zeroize"] }
x509-parser = { version = "=0.18.1", default-features = false }
pem = { version = "=3.0.6", default-features = false }
kube = { version = "=4.0.0", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_35"] }
# Plain-HTTP client for the metadata server (and later the config-server): hyper's HTTP/1 client over a TcpStream, with a
# timeout and a body cap, instead of reqwest, which would bring a second TLS stack. Retry jitter comes from fastrand.
hyper = { version = "=1.11.1", default-features = false }
# The fake Kubernetes API server in the agent's tests streams watch events as HTTP body frames (T6); already in the graph through hyper.
http-body = "=1.1.0"
http-body-util = "=0.1.5"
fastrand = "=2.5.0"
# Agent logging (T7): `fmt` + `json` write one JSON object per line, and `Targets` keeps the Kubernetes client libraries,
# which log the API server's own message text, silent (S10). No `env-filter`: it brings a regex engine, and the level
# comes from `LK_LOG`. `json` adds tracing-serde (0.2.0, 2024-11-27), which is tracing-subscriber's own JSON encoder.
tracing-subscriber = { version = "=0.3.23", default-features = false }
# Agent metrics (T7, S16): the Prometheus text format for `/metrics`. prometheus-client 0.25.1 (2026-09-01) is the
# OpenMetrics client the plan names; `derive` and the protobuf feature stay off, so it adds only dtoa, itoa and parking_lot.
prometheus-client = { version = "=0.25.1", default-features = false }
time = { version = "=0.3.55", default-features = false }
# Agent transport (T3, S6). The agent builds its own rustls config so that TLS 1.3 is the only version it can speak
# and the hub CA is the only root; tonic's TLS features are not used. Both crates are already in the graph through
# kube; the pins are the versions in the lockfile (rustls 2026-09-14, tokio-rustls 2026-09-04). The agent asks for
# TLS 1.3 only at run time (`transport::tls`), whatever features other crates turn on; `tls12` is enabled in the agent's
# dev-dependencies alone, for the tests that prove a TLS 1.2 hub is refused.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["aws_lc_rs"] }
# Agent scanning (T4, P1, P4). rayon runs the walk and the hashing on a dedicated pool of the configured size, never the
# global pool, and always inside `spawn_blocking` (code rule 4). sha2 is the Merkle and content hash (already pinned).
rayon = "=1.12.0"
# Agent spool (T9, D74, P15). crc32fast checksums every spooled record, so a torn or damaged tail is found at the first bad
# frame instead of being believed. 1.5.0 (2025-07-13) is the version in the lockfile's registry cache; with `std` it
# uses the CPU's CRC instructions at run time. Its only dependency, cfg-if, is already in the graph.
crc32fast = { version = "=1.5.0", default-features = false, features = ["std"] }
# Shared by hub-identity (prompt 03a) and hub-platform / hub (prompt 03b): one pin per crate, and the union of the features each
# side needs. Both sides pinned the same exact versions. The comments of both prompts follow.
#
# axum (0.8.9, 2026-04-14; already in the graph through tonic) is the web framework. 03a (T3): the session, CSRF and auth layers
# and the /auth routes (`tokio`, `http1`, `query`, `matched-path`). 03b (T1): the web edge; the hub serves HTTPS through its own
# rustls acceptor (hyper-util), so axum's own server glue is not used for the web listener (adds `http2`, `json`).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "matched-path", "query", "tokio"] }
# moka (0.12.16, 2026-08-09) is the stack's cache. 03a: the session cache holds at most 50,000 entries for at most 30 seconds, with
# single-flight loads (`future`). 03b: per-IP and per-user rate-limit buckets and the blob and tree-index caches (T8, T7), bounded,
# time-to-idle, weighted (`sync`).
moka = { version = "=0.12.16", default-features = false, features = ["future", "sync"] }
# aws-lc-rs is the stack's one crypto provider (already in the graph through rustls and rcgen). 03a: it verifies the RS256 signature
# of id and access tokens (`ring-sig-verify`), seals the login cookie (AES-256-GCM) and makes the random ids. 03b: request ids and
# CSP nonces come from its CSPRNG. Pinned to the lockfile version. `openidconnect` and `jsonwebtoken` are not used (03a decision B1):
# the first needs `rsa` (RUSTSEC-2023-0071), and the second adds a provider switch that panics when none is installed.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys", "alloc", "ring-sig-verify"] }
# base64 0.22.1 is the version nearly the whole graph already uses. 03a reads JWT parts; 03b (T2, A9) speaks base64 in JSON to the
# Google APIs (Secret Manager and Cloud KMS, no SDK).
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
# rustls-native-certs reads the platform's root certificates (already in the graph through sqlx). webpki-roots is refused by
# deny.toml (its licence is not allowed). 03a verifies the Entra endpoints with it; 03b verifies `*.googleapis.com` with it.
# 0.8.4 has no cargo features, so `default-features = false` (03b) and the plain pin (03a) mean the same.
rustls-native-certs = { version = "=0.8.4", default-features = false }
# Hub identity (prompt 03a, T1). `url` builds and checks the endpoint URLs.
url = { version = "=2.5.8", default-features = false, features = ["std"] }
# Traces (03b T1, A9): OTLP over gRPC to an in-cluster collector, which forwards to Cloud Trace. Plain http to the collector, so no TLS feature.
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
# Git mirror (prompt 03b, T7, A16). gix 0.87.1 (2026-08-24, 48 days old). `blocking-http-transport-reqwest-rust-tls` is the one HTTPS
# transport on rustls with aws-lc-rs (no openssl, no native-tls; ring is not in this crate's graph, but it is in the `hub` binary,
# through sqlx's database-leg TLS, A15); reqwest arrives only as gix-transport's HTTP client
# (a human accepted it, blockers file A16) and is never a direct dependency or used in our code. `max-performance-safe` is
# gix's parallel pack decoding and pack caches (safe Rust); `revision` is `describe`; `sha1` is the object hash of the mirrors.
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "max-performance-safe", "revision", "blocking-http-transport-reqwest-rust-tls"] }
# Fact engine (prompt 04, T2, D90). granit-parser 1.3.0 (2026-09-16, 27 days old) is the event-level YAML parser: marks for every
# event, anchors and aliases as events (so alias expansion is counted, never built), nesting limits, `forbid(unsafe_code)`. It is
# already in the lockfile through serde-saphyr. `std` only: the error message text is never used, and comments are switched off at run
# time. 2.0.0 (released 2026-10-13) is refused for its age. json-event-parser 0.2.3 (2026-02-06) is the strict JSON tokeniser; its
# low-level parser has no I/O and a configurable stack limit, and the engine counts lines from the bytes it consumes.
granit-parser = { version = "=1.3.0", default-features = false, features = ["std"] }
json-event-parser = "=0.2.3"
# Fact engine (prompt 04, T3, D54). tree-sitter 0.26.13 (2026-08-23, 51 days old) with the YAML grammar tree-sitter-yaml 0.7.2
# (2025-10-07) maps a setting path to its line range. Only the engine's own parser has read the bytes by then: tree-sitter (C code)
# is given only input that parser accepted under the limits, and it is cancelled by a work budget. 0.27.x needs rustc 1.90 and the
# toolchain is pinned to 1.88. `std` only: no wasm engine, and the grammar's C sources are built by the `cc` build dependency.
tree-sitter = { version = "=0.26.13", default-features = false, features = ["std"] }
tree-sitter-yaml = "=0.7.2"
# Fact engine (prompt 04, T5, D54). similar 2.7.0 gives the line diff (Patience, which reads better on config than Myers). Already in
# the lockfile through insta, so it is not new to `cargo deny`; 3.x has no feature the engine needs. Default features only: `text`
# is empty (no dependency behind it), and the engine uses only the algorithms and the grouping of operations, not the text layer.
similar = "=2.7.0"
# Fact engine (prompt 04, T7, D54). The text search is ripgrep's own: grep-regex 0.1.14 (2025-10-16) builds the matcher from the Rust
# `regex` engine (linear time, with the size, DFA and nesting limits of `Limits`), grep-searcher 0.1.17 (2026-07-15, 90 days old)
# searches one in-memory slice and reports line numbers, grep-matcher 0.1.9 (2026-07-15) is the trait between them. No features: the
# searcher's `simd-accel` and `avx-accel` only speed up non-UTF-8 transcoding, which the engine does itself (it decodes first). The
# engine never maps a file and never reads one: it searches the bytes it is given. rayon is already pinned (the agent's scanning).
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
grep-matcher = "=0.1.9"
# Test tooling
proptest = "=1.11.0"
insta = "=1.48.0"
static_assertions = "=1.1.0"
tempfile = "=3.27.0"
testcontainers = { version = "=0.28.0", default-features = false }
# Agent benchmarks (T4, P4, rule 14). Without the HTML report (plotters) and the global rayon feature: `cargo bench` only
# needs the harness and the `sample.json` files that `cargo xtask bench-check` reads.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
